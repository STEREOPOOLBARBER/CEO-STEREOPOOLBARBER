# Corre todas las pruebas en cada push a main/desarrollo y en cada pull request.
# Si algo falla, no se debe pasar a producción (proteger la rama main en GitHub: Settings → Branches).
name: Pruebas
on:
  push:
    branches: [main, desarrollo]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm test
