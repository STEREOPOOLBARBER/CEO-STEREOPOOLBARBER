<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/img/app/icono-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi cita">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<title>Tu cita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<!-- App del cliente: fondo blanco, sin emojis (íconos de /img/iconos.svg) y los colores de la marca (⚙️ Config → Marca). -->
<style>
:root{--bg:#ffffff;--suave:#f6f4f9;--card:#ffffff;--bd:#e7e3ee;--tx:#15111d;--mu:#6b6478;--blue:#8a3ffc;--pur:#ff3fd2;--ok:#15803d;--ok-bg:#e9f7ee;--av:#9a5b00;--av-bg:#fff4e0;--mal:#c81e1e;--mal-bg:#fdecec;--col:480px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:15px/1.5 'DM Sans',system-ui,-apple-system,sans-serif;max-width:var(--col);margin:0 auto;min-height:100vh;min-height:100dvh;overflow-x:clip;display:flex;flex-direction:column}
@media (min-width:520px){html{background:var(--suave)}body{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ic.lleno{fill:currentColor;stroke:none}
/* cabecera */
.cab{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.cab .logo{width:44px;height:44px;border-radius:12px;background:#000;display:grid;place-items:center;overflow:hidden;flex:none;color:#fff;font:800 18px 'Syne'}
.cab .logo img{width:100%;height:100%;object-fit:cover}
.cab h1{font:800 17px/1.15 'Syne',sans-serif}.cab p{font-size:12.5px;color:var(--mu)}
main{flex:1;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.hola h2{font:800 26px/1.15 'Syne',sans-serif;letter-spacing:-.3px}.hola p{color:var(--mu);font-size:14px;margin:4px 0 14px}
/* tarjetas */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.estado{border-left:4px solid var(--blue);box-shadow:0 6px 24px #15111d0f}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--suave);color:var(--mu)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.av{background:var(--av-bg);color:var(--av)}.pill.mal{background:var(--mal-bg);color:var(--mal)}.pill.mar{background:#f2ebff;color:var(--blue)}
.codigo{font-weight:800;letter-spacing:.12em;color:var(--blue);background:#f2ebff;border:1px solid #e2d4fd;border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px}
.titulo{font:800 23px/1.2 'Syne',sans-serif;margin:12px 0 4px}.sub{color:var(--mu);font-size:14px}
.cuenta{margin-top:10px;font-weight:700;display:flex;align-items:center;gap:8px}
/* pasos */
.pasos{list-style:none;display:flex;margin:18px 0 4px}
.pasos li{flex:1;position:relative;text-align:center;font-size:11.5px;font-weight:700;color:var(--mu)}
.pasos li:not(:first-child)::before{content:"";position:absolute;top:15px;right:50%;width:100%;height:3px;background:var(--bd)}
.pasos li.hecho:not(:first-child)::before,.pasos li.ahora:not(:first-child)::before{background:var(--blue)}
.punto{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;margin:0 auto 6px;border-radius:50%;background:#fff;border:2px solid var(--bd);color:var(--mu)}
.punto .ic{width:16px;height:16px;vertical-align:0}
.pasos li.hecho .punto{background:var(--blue);border-color:var(--blue);color:#fff}
.pasos li.ahora .punto{background:var(--pur);border-color:var(--pur);color:#fff;box-shadow:0 0 0 5px #ff3fd226}.pasos li.ahora{color:var(--tx)}
/* datos */
.datos{display:grid;gap:12px}.dato{display:flex;gap:12px;align-items:flex-start}.dato .ic{color:var(--blue);margin-top:2px}.dato b{display:block;font-size:14px}.dato small{display:block;color:var(--mu);font-size:12.5px}
.h3{font:800 17px 'Syne',sans-serif;margin-bottom:10px;display:flex;align-items:center;gap:8px}.h3 .ic{color:var(--blue)}
/* botones (mínimo 48 px de alto para el dedo) */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 16px;border-radius:14px;border:1px solid var(--bd);background:#fff;font-weight:700;text-decoration:none;width:100%}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}.btn.sec{background:var(--suave);border-color:var(--suave)}
.btn:disabled{opacity:.5}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mt{margin-top:10px}
.aviso{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px;font-size:13.5px;margin-top:12px}.aviso.ok{background:var(--ok-bg);color:#0f5a2c}.aviso.av{background:var(--av-bg);color:#7a4700}.aviso .ic{margin-top:1px}
/* QR */
.qr{text-align:center}.qr #qrCita{display:inline-block;padding:12px;border:1px solid var(--bd);border-radius:16px;line-height:0;background:#fff}.qr #qrCita img,.qr #qrCita canvas{width:196px;height:196px}
.qr p{font-size:13.5px;color:var(--mu);margin-top:10px}
/* fotos, calificación */
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fotos a{position:relative;display:block;color:#fff;text-decoration:none}.fotos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block;background:var(--suave)}.fotos span{position:absolute;left:8px;bottom:8px;font:700 11px 'DM Sans';letter-spacing:.08em;background:#000000a6;padding:3px 8px;border-radius:8px}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0}.stars button{background:none;border:0;color:#d9d4e2;padding:4px;line-height:0}.stars button .ic{width:34px;height:34px}.stars button.on{color:#f5b301}
.chipsc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chipsc button{padding:9px 14px;border-radius:999px;border:1px solid var(--bd);background:#fff;font-weight:700;font-size:13px}.chipsc button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.in{width:100%;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 13px;outline:none}.in:focus{border-color:var(--blue)}
.nota{font-size:12.5px;color:var(--mu);text-align:center;margin-top:6px}
/* instalar */
/* Promociones: fila que se desliza con el dedo (tarjetas de 152 px, como en Total Tools). */
.promos{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 12px;padding:2px 16px 4px;scrollbar-width:none}.promos::-webkit-scrollbar{display:none}
.promo{flex:0 0 152px;scroll-snap-align:start;background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.promo .img{height:96px;background:linear-gradient(135deg,var(--blue),var(--pur));display:grid;place-items:center;color:#fff}.promo .img img{width:100%;height:100%;object-fit:cover}.promo .img .ic{width:34px;height:34px}
.promo .cu{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}.promo b{font-size:14px;line-height:1.25}.promo small{font-size:12px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.promo .pre{margin-top:auto;font-weight:800;color:var(--blue)}.promo .pre s{color:var(--mu);font-weight:500;margin-right:4px}.promo .vig{font-size:11.5px;color:var(--mu)}
.promo .btn{min-height:44px;padding:8px;font-size:13px;border-radius:0;border:0;border-top:1px solid var(--bd);color:var(--blue)}
.promos-t{display:flex;align-items:center;gap:8px;font:800 17px 'Syne',sans-serif;margin:6px 0 10px}.promos-t .ic{color:var(--blue)}
.instalar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#f2ebff,#ffe7f8)}
.instalar .t{flex:1;min-width:0}.instalar b{display:block;font-size:14px}.instalar small{display:block;font-size:12.5px;color:var(--mu)}
.instalar .btn{width:auto;min-height:44px;padding:10px 14px;font-size:13.5px}
.pasosi{display:grid;gap:12px;margin:6px 0}.pasosi div{display:flex;gap:12px;align-items:flex-start}.pasosi i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
/* mapa y política */
.mapa iframe{width:100%;height:210px;border:0;border-radius:12px;background:var(--suave);display:block;margin-bottom:10px}
details{border-top:1px solid var(--bd);padding:12px 0}details:first-of-type{border-top:0}summary{font-weight:700;cursor:pointer}details div{white-space:pre-line;color:var(--mu);font-size:13.5px;margin-top:6px}
/* reprogramar */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:none;width:64px;padding:9px 0;border-radius:14px;border:1px solid var(--bd);background:#fff;text-align:center}.day b{display:block;font:800 21px 'Syne'}.day small{font-size:11px;color:var(--mu);text-transform:uppercase;font-weight:700}
.day.on{background:var(--blue);border-color:var(--blue);color:#fff}.day.on small{color:#fff}.day:disabled{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{min-height:48px;border-radius:12px;border:1px solid var(--bd);background:#fff;font-weight:700}.slot.on{background:var(--blue);border-color:var(--blue);color:#fff}.slot:disabled{opacity:.35;text-decoration:line-through}
/* barra de acciones fija: siempre visible, por encima de la barra del iPhone */
.foot{position:fixed;left:max(0px,calc((100vw - var(--col)) / 2));right:max(0px,calc((100vw - var(--col)) / 2));bottom:0;z-index:30;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(8px);border-top:1px solid var(--bd)}
.foot .btn{min-height:50px}
.pie{text-align:center;font-size:12px;color:var(--mu);padding:0 16px 8px}.pie a{color:var(--mu)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,160px);background:var(--tx);color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;z-index:80;transition:.3s;max-width:min(92vw,440px);text-align:center}.toast.on{transform:translate(-50%,0)}
.spin{width:34px;height:34px;border:3px solid var(--bd);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}@keyframes sp{to{transform:rotate(360deg)}}
.vacio{text-align:center;color:var(--mu);padding:24px 8px}
.modal{position:fixed;inset:0;z-index:60;background:#15111d80;display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}
.hoja{background:#fff;width:100%;max-width:var(--col);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
@supports (-webkit-touch-callout:none){input,select,textarea{font-size:16px}}
/* narrador en estilo claro */
body #narr{bottom:calc(84px + env(safe-area-inset-bottom))}
body #narr .bub{background:#fff;color:var(--tx);border-color:var(--bd);box-shadow:0 10px 30px #15111d26}
body #narr .bub b{color:var(--blue)}
body #narr .sp{background:#fff;border-color:var(--bd)}
body #nArm{background:#fff;border-color:var(--bd);bottom:calc(84px + env(safe-area-inset-bottom))}
</style>
<link rel="stylesheet" href="/css/escena.css">
</head>
<body>
<header class="cab" id="cab"><div class="logo">S</div><div><h1>Tu cita</h1><p>Cargando…</p></div></header>
<main id="app"><div class="spin"></div></main>
<p class="pie"><a href="/privacidad.html">Aviso de privacidad</a></p>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" data-on-click="cerrarHoja"><div class="hoja" id="hoja"></div></div>
<div id="narr"></div><button id="nArm" title="Traer al personaje" aria-label="Traer al personaje"><svg class="ic"><use href="/img/iconos.svg#persona"/></svg></button>
<div id="splash" class="glow" role="button" tabindex="0" aria-label="Toca para entrar"><canvas id="spc"></canvas><div class="ld"></div><p class="toca">Toca para entrar</p></div>
<script src="/js/eventos.js"></script>
<script src="/js/voz.js"></script>
<script src="/js/escena.js"></script>
<script src="/vendor/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU"></script>
<script src="/js/estado.js"></script>
</body>
</html>
