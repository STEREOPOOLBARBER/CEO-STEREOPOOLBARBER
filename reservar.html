<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0812">
<title>Reserva tu corte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0812;--card:#15101f;--card2:#1d1530;--line:#33264a;--tx:#f3eefc;--mu:#a397b8;--blue:#8a3ffc;--pur:#ff3fd2;--grn:#3fb950;--red:#f85149;--yel:#d29922;--org:#f0883e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 'DM Sans',system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 30px;min-height:100vh;display:flex;flex-direction:column}
.hero{display:flex;align-items:center;gap:12px;padding:18px 0 6px}
.logo{overflow:hidden;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--pur));display:grid;place-items:center;font-size:30px;flex:none}
.hero h1{font:800 22px/1.1 'Syne'}
.hero p{color:var(--mu);font-size:13px;margin-top:3px}
.hero a{color:var(--blue);text-decoration:none}
.prog{display:flex;gap:6px;margin:14px 0 4px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.prog i.on{background:linear-gradient(90deg,var(--blue),var(--pur))}
.pt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:10px 0 2px}
h2{font:800 24px 'Syne';margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.opt.on{border-color:var(--blue);background:rgba(138,63,252,.08)}
.opt .em{width:60px;height:60px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:30px;flex:none;overflow:hidden}
.opt .em img{width:100%;height:100%;object-fit:cover}
.opt .em.round{border-radius:50%}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:16px}
.opt .t small{color:var(--mu);font-size:13px}
.opt .pr{font:800 17px 'Syne';color:var(--grn)}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:66px;padding:10px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:center}
.day b{display:block;font:800 22px 'Syne'}
.day small{font-size:11px;color:var(--mu);text-transform:uppercase;font-weight:700}
.day.on{background:var(--blue);border-color:var(--blue)}.day.on small{color:#fff}
.day:disabled{opacity:.3;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:14px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.slot.on{background:var(--blue);border-color:var(--blue);color:#fff}
.slot:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.lb{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:14px 0 6px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}
.in:focus{border-color:var(--blue)}
.pre{display:flex}.pre span{padding:13px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--card2);color:var(--mu)}.pre .in{border-radius:0 12px 12px 0}
.upl{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:12px;cursor:pointer}
.upl input{display:none}
.upl .prev{width:64px;height:64px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none}
.upl .prev img{width:100%;height:100%;object-fit:cover}
.foot{position:sticky;bottom:0;margin-top:auto;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;flex:1}
.btn.g{background:#238636;border-color:#2ea043;color:#fff;flex:1}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.res{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px}
.res span:nth-child(odd){color:var(--mu)}
.pay{background:linear-gradient(135deg,rgba(255,63,210,.18),rgba(138,63,252,.12));border:1px solid var(--pur);border-radius:20px;padding:18px;text-align:center}
.amt{font:800 46px/1 'Syne';color:var(--pur);margin:6px 0}
.ynum{font:800 26px 'Syne';letter-spacing:.04em}
.timer{font:800 28px 'Syne';color:var(--yel)}
.copy{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;margin-top:6px}
.qr{width:180px;border-radius:14px;margin:12px auto 0;display:block;background:#fff}
.ok{text-align:center;padding:20px 0}
.ok b{font-size:70px;display:block}
.code{font:800 30px 'Syne';letter-spacing:.15em;color:var(--blue)}
.err{color:var(--red);font-size:13px;margin-top:6px;min-height:18px}
.warn{background:rgba(210,153,34,.1);border:1px solid var(--yel);color:var(--yel);border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:99px;font-weight:700;z-index:80;transition:.3s;max-width:92%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mu);margin-top:14px}
.chk input{width:20px;height:20px;accent-color:var(--blue);flex:none;margin-top:1px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* pantalla de carga */
#splash{position:fixed;inset:0;z-index:100;background-color:#000;transition:background-color .9s,opacity .5s}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
#splash.glow canvas{animation:glow 1.3s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 0 rgba(255,200,60,0)) brightness(1)}to{filter:drop-shadow(0 0 18px rgba(255,200,60,.45)) brightness(1.12)}}
#splash .ld{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:120px;height:3px;border-radius:3px;background:#222;overflow:hidden}
#splash .ld::after{content:'';position:absolute;inset:0;width:40%;background:linear-gradient(90deg,#b8860b,#ffd76a,#b8860b);animation:ldm 1s ease-in-out infinite}
@keyframes ldm{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
/* narrador */
#narr{position:fixed;left:6px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:flex-end;gap:8px;pointer-events:none;transition:bottom .25s}
#narr .av{width:92px;height:92px;background:center/contain no-repeat;filter:drop-shadow(0 6px 12px rgba(0,0,0,.7));pointer-events:auto;cursor:pointer;flex:none;position:relative;display:grid;place-items:center;font-size:26px;touch-action:none;-webkit-user-select:none;user-select:none;transition:.2s}
#narr .av.talk{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px) scale(1.04)}}
#narr .sp{position:absolute;right:2px;top:2px;font-size:12px;background:#000;border:1px solid #e01b1b;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
#narr .bub{max-width:min(68vw,290px);background:#15101f;border:1px solid #e01b1b;color:#fff;padding:10px 12px;border-radius:16px 16px 16px 4px;font-size:14px;font-weight:600;line-height:1.35;opacity:0;transform:translateY(8px) scale(.96);transform-origin:bottom left;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#narr .bub.on{opacity:1;transform:none;pointer-events:auto}
#narr .bub b{display:block;font:800 11px 'Syne';letter-spacing:.08em;text-transform:uppercase;color:#ff4d4d;margin-bottom:2px}
#narr{display:block;width:92px;height:92px}
#narr .av{position:absolute;left:0;top:0}
#narr .bub{position:absolute;left:calc(100% + 8px);bottom:6px;width:max-content}
#narr.rev .bub{left:auto;right:calc(100% + 8px);border-radius:16px 16px 4px 16px;transform-origin:bottom right}
#narr.top .bub{bottom:auto;top:6px}
#narr.off{display:none}
#narr.drag .av{cursor:grabbing;filter:drop-shadow(0 12px 18px rgba(0,0,0,.8));transform:scale(1.06)}
#nArm{position:fixed;left:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;width:48px;height:48px;border-radius:0 24px 24px 0;background:#15101f;border:1px solid #e01b1b;border-left:0;font-size:24px;display:none;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.5);cursor:pointer;transition:bottom .25s}
.est{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:6px 0 14px}.est b.i{font-size:54px;line-height:1}.est h2{margin:4px 0 0}.est .fl{font:800 22px 'Syne';margin-top:6px}
.mapa{padding:10px}.mapa iframe{width:100%;height:230px;border:0;border-radius:12px;background:#222;display:block}.mapa .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mapa a.btn{text-decoration:none;color:var(--tx);font-size:14px;padding:12px}
.wrap{padding-bottom:90px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero"><div class="logo">💈</div><div><h1>Cargando…</h1></div></header>

</div>
<div class="toast" id="toast"></div>
<div id="narr"></div><button id="nArm" onclick="narrVolver()" title="Traer al personaje" aria-label="Traer al personaje">💪</button>

<script>
/* =====================================================================
   BARBERÍA · FORMULARIO DE RESERVAS (público)
   Modo nube:  publicado en Cloudflare usa la API /api (worker/index.js).
   Modo local: abierto como archivo o en GitHub Pages, comparte datos con
               index.html en el mismo navegador.
   Endpoints públicos del Worker:
   GET  /publico                 -> {cfg,barberos,servicios,ocupados:[{b,f,h}],ts}
   GET  /publico/link/:token     -> link personal
   POST /publico/reservas        {servicioId,barberoId|'any',fecha,hora,cliente,nota,refFoto,turnstile,linkToken}
                                 -> {id,codigo,expira,barberoId,estado}
   POST /publico/reservas/:id/captura {codigo,data} -> {ok}
   El Worker vuelve a validar horario, precio y Turnstile: el navegador no decide nada.
   ===================================================================== */
const CONFIG={API_URL:/^https?:$/.test(location.protocol)&&!/(^|\.)github\.io$/.test(location.hostname)?'/api':'',TURNSTILE_SITEKEY:'',DUR:60};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const hoy=()=>ymd(new Date());
const toMin=h=>{if(!h)return null;const[a,b]=h.split(':').map(Number);return a*60+b};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],DIASL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fLarga=s=>{const d=pYmd(s);return `${DIASL[d.getDay()]} ${d.getDate()} de ${MES[d.getMonth()]}`};
const h12=h=>{if(!h)return'';let[H,M]=h.split(':').map(Number);const ap=H>=12?'p.m.':'a.m.';H=H%12||12;return `${H}:${pad(M)} ${ap}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const codigo=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const soles=n=>{n=Number(n)||0;return 'S/ '+(n%1?n.toFixed(2):n)};
const waNum=t=>{let d=String(t||'').replace(/\D/g,'');if(d.length===9)d='51'+d;return d};
/* En computadora se abre WhatsApp Web directo (evita que los emojis salgan como signos de pregunta). */
const waUrl=(n,t)=>(!n||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent))?`https://wa.me/${n||''}?text=${encodeURIComponent(t)}`:`https://web.whatsapp.com/send?phone=${n}&text=${encodeURIComponent(t)}`;
const lsGet=(k,d)=>{try{const v=localStorage.getItem('brb_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem('brb_'+k,JSON.stringify(v));return true}catch(e){return false}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)}
function copiar(txt){navigator.clipboard?.writeText(txt).then(()=>toast('📋 Copiado')).catch(()=>prompt('Copia:',txt))}

const IDB={_db:null,open(){return this._db||(this._db=new Promise((res,rej)=>{const r=indexedDB.open('brb_fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=()=>res(k);t.onerror=()=>rej(t.error)})},
 async get(k){const db=await this.open();return new Promise(res=>{const r=db.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}};
function compressImg(file,max=1000,q=.72){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(new Error('Imagen no válida'));img.src=url})}

/* mismos valores por defecto que el panel */

const COLORES=['#ff3fd2','#8a3ffc','#3fb950','#f0883e','#d29922','#f85149','#39c5cf','#db61a2'];

const DEF_BARB=()=>[['Jhon','Fades y degradados'],['Brayan','Diseños y freestyle'],['Piero','Cortes clásicos'],['Alexis','Barba y perfilado'],['Renzo','Taper y mullet']].map(([n,e],i)=>({id:'b'+(i+1),nombre:n,esp:e,foto:'',color:COLORES[i],pin:String(i+1).repeat(4),comision:50,dias:[1,2,3,4,5,6],activo:true}));
const DEF_SERV=()=>[
 {id:'s1',emoji:'✂️',nombre:'Corte clásico',precio:25,desc:'Tijera y máquina, acabado limpio',foto:'',activo:true},
 {id:'s2',emoji:'🔥',nombre:'Fade / Degradado',precio:30,desc:'Low, mid o high fade',foto:'',activo:true},
 {id:'s3',emoji:'💈',nombre:'Taper',precio:30,desc:'Degradado suave en patillas y nuca',foto:'',activo:true},

/* =================== PANTALLA DE CARGA (se derrite) =================== */
const SPL={start:Date.now(),drawn:false,done:false,dpr:Math.min(2,window.devicePixelRatio||1)};
function splashInit(){const cfg=mergeCfg(lsGet('cfg',{}));SPL.cfg=cfg;
 if(cfg.splashOn===false){$('#splash').remove();SPL.done=true;return}
 const c=$('#spc');c.width=innerWidth*SPL.dpr;c.height=innerHeight*SPL.dpr;
 const load=src=>new Promise(res=>{if(!src)return res(null);const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src});
 (async()=>{let src=IMG_LOGO;if(cfg.splashImg){try{src=(await API.foto(cfg.splashImg))||IMG_LOGO}catch(e){}}
  SPL.img=alfa(await load(src));if(src===IMG_LOGO)SPL.drip=alfa(await load(IMG_DRIP));drawSplash(SPL.img,1)})();
 setTimeout(meltSplash,6000)}
/* convierte el fondo negro del logo en transparente para que solo caiga el dorado */
function alfa(img){if(!img)return null;try{const c=document.createElement('canvas');c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;const x=c.getContext('2d');if(!x)return img;x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){const m=Math.max(p[i],p[i+1],p[i+2]);p[i+3]=Math.min(255,Math.max(0,(m-18)*4))}x.putImageData(d,0,0);return c}catch(e){return img}}
function rectFor(img,W,H){const w=Math.min(W*.88,470*SPL.dpr),h=w*img.height/img.width,hh=Math.min(h,H*.55),ww=hh*img.width/img.height;return[(W-ww)/2,(H-hh)/2-H*.04,ww,hh]}
function drawSplash(img,a){const c=$('#spc');if(!c||SPL.done&&!SPL.fading)return;const x=c.getContext('2d'),W=c.width,H=c.height;if(!x){SPL.drawn=true;return}x.clearRect(0,0,W,H);
 if(img&&img.width){x.globalAlpha=1;x.drawImage(img,...rectFor(img,W,H));if(SPL.drip&&a<1){}}
 else{const name=(SPL.cfg?.nombre||'Barbería').toUpperCase();let fs=Math.min(W*.13,90*SPL.dpr);x.font=`800 ${fs}px Syne, serif`;while(x.measureText(name).width>W*.86&&fs>14){fs-=2;x.font=`800 ${fs}px Syne, serif`}
  const g=x.createLinearGradient(0,H/2-fs,0,H/2+fs*.4);g.addColorStop(0,'#fff3b0');g.addColorStop(.45,'#f5c542');g.addColorStop(1,'#a8740b');x.fillStyle=g;x.textAlign='center';x.textBaseline='middle';x.fillText(name,W/2,H/2-H*.04)}
 SPL.drawn=true}
function meltSplash(){const sp=$('#splash');if(!sp||SPL.done)return;
 if(!SPL.drawn&&Date.now()-SPL.start<3000)return setTimeout(meltSplash,150);
 SPL.done=true;sp.classList.remove('glow');sp.querySelector('.ld')?.remove();sp.style.pointerEvents='none';
 const c=$('#spc'),x=c.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduce||SPL.cfg?.splashMelt===false||!x){sp.style.opacity='0';setTimeout(()=>sp.remove(),550);return}
 const W=c.width,H=c.height;
 /* 1) el logo se transforma en su versión derretida */
 const morph=SPL.drip&&SPL.img?650:0,t0=performance.now();
 (function mf(now){const t=now-t0;if(morph){const k=Math.min(1,t/morph);x.clearRect(0,0,W,H);x.globalAlpha=1-k;x.drawImage(SPL.img,...rectFor(SPL.img,W,H));x.globalAlpha=k;const r=rectFor(SPL.drip,W,H);x.drawImage(SPL.drip,r[0],r[1]+k*H*.015,r[2],r[3]*(1+k*.04));x.globalAlpha=1}
  if(t<morph+250)requestAnimationFrame(mf);else caer()})(t0);
 /* 2) cae en gotas */
 function caer(){const snap=document.createElement('canvas');snap.width=W;snap.height=H;snap.getContext('2d').drawImage(c,0,0);
  const sw=Math.max(2,Math.round(3*SPL.dpr)),cols=Math.ceil(W/sw),del=[];let n=Math.random()*8;
  for(let i=0;i<cols;i++){n+=(Math.random()-.5)*1.8;n=Math.max(0,Math.min(16,n));del.push(n*22+Math.random()*25)}
  sp.style.backgroundColor='rgba(0,0,0,0)';const s0=performance.now(),END=1700;
  (function fr(now){const t=now-s0;x.clearRect(0,0,W,H);x.globalAlpha=Math.max(0,1-Math.max(0,t-900)/800);
   for(let i=0;i<cols;i++){const tt=Math.max(0,t-del[i])/1000,dy=tt*tt*H*1.6;if(dy>=H)continue;x.drawImage(snap,i*sw,0,sw,H,i*sw,dy,sw,H*(1+dy/H*1.4))}
   if(t<END)requestAnimationFrame(fr);else sp.remove()})(s0)}}
function splashListo(){setTimeout(meltSplash,Math.max(0,1100-(Date.now()-SPL.start)))}

const NR={last:'',lastKey:'',audio:new Audio(),cache:new Map(),unlocked:false,voz:lsGet('narrVoz',null),off:lsGet('narrOff',false),pos:lsGet('narrPos',null),hide:null,voice:null};
function nv(){const s=serv(),b=P.barberos.find(x=>x.id===(F.cita?.barberoId||F.barb));return{narrador:P.cfg.narrNombre,servicio:s?.nombre||'',precio:s?soles(s.precio):'',barbero:b?.nombre||'',especialidad:b?.esp||'',fecha:F.fecha?fLarga(F.fecha).toLowerCase():'',hora:F.hora?h12(F.hora):'',cliente:(F.cli.nombre||'').split(' ')[0],adelanto:soles(adel()),yape:(P.cfg.yapeNum||'').replace(/(\d{3})(\d{3})(\d{3})/,'$1 $2 $3'),negocio:P.cfg.nombre}}
function narrColoca(){const el=$('#narr');if(!el)return;const w=innerWidth,h=innerHeight;let x,y;
 if(NR.pos){x=Math.min(Math.max(2,NR.pos.x*w),w-96);y=Math.min(Math.max(2,NR.pos.y*h),h-96);el.style.left=x+'px';el.style.top=y+'px';el.style.bottom='auto'}
 else{x=6;y=h-92-16;el.style.left='6px';el.style.top='auto'}
 narrLado(x,y)}
/* El globo de texto sale hacia el lado con más espacio y nunca se corta. */
function narrLado(x,y){const el=$('#narr'),b=$('#nBub'),w=innerWidth,izq=x-12,der=w-(x+92)-12,rev=izq>der;el.classList.toggle('rev',rev);el.classList.toggle('top',y<170);if(b)b.style.maxWidth=Math.max(130,Math.min(290,rev?izq:der))+'px'}
function narrEstado(){const el=$('#narr'),ar=$('#nArm');if(el)el.classList.toggle('off',NR.off);if(ar)ar.style.display=NR.off?'grid':'none'}

const VOZ_F=/(female|mujer|paulina|m[oó]nica|sabina|helena|laura|marisol|luc[ií]a|mar[ií]a|paloma|elena|esperanza|valentina|camila|dalia|elvira|salome|sof[ií]a|isabela|carmen|rosa|ximena|angelica|catalina|marina|nuria|esf\b)/i;
const VOZ_M=/(male|hombre|jorge|pablo|diego|carlos|miguel|juan|ra[uú]l|[aá]lvaro|enrique|antonio|andr[eé]s|alberto|luciano|pedro|jaime|ricardo|tom[aá]s|david|fernando|reed|esd\b)/i;
function elegirVoz(){const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));const lat=v=>/es[-_](PE|419|MX|US|AR|CO|CL)/i.test(v.lang);
 NR.voice=vs.find(v=>VOZ_M.test(v.name)&&!VOZ_F.test(v.name)&&lat(v))||vs.find(v=>VOZ_M.test(v.name)&&!VOZ_F.test(v.name))||vs.find(v=>!VOZ_F.test(v.name)&&lat(v))||vs.find(v=>!VOZ_F.test(v.name))||vs.find(lat)||vs[0]||null}
function narrInit(){const c=P.cfg,el=$('#narr');if(!c.narrOn||!el){el?.remove();$('#nArm')?.remove();return}
 if(NR.voz===null)NR.voz=!!c.narrVoz;
 el.innerHTML=`<div class="av" id="nAv"><span class="sp" id="nSp"></span></div><div class="bub" id="nBub"></div>`;
 API.foto(c.narrImg).then(src=>{const u=src||IMG_NARR,i=new Image();i.onload=()=>{$('#nAv').style.backgroundImage=`url("${u}")`};i.onerror=()=>{$('#nAv').insertAdjacentText('afterbegin','💪')};i.src=u});
 const av=$('#nAv'),spb=$('#nSp');let pid=null,sx=0,sy=0,ox=0,oy=0,mov=false;
 spb.addEventListener('pointerdown',e=>e.stopPropagation());

 /* arrastrar = mover al personaje · tocar sin arrastrar = hacerlo desaparecer (el brazo 💪 de la esquina lo trae de vuelta) */

 av.addEventListener('pointercancel',()=>{pid=null;el.classList.remove('drag')});
 addEventListener('resize',narrColoca);
 addEventListener('pointerdown',()=>{if(NR.unlocked)return;NR.unlocked=true;NR.audio.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=';NR.audio.play().then(()=>NR.audio.pause()).catch(()=>{})},{capture:true,once:true});
 $('#nBub').addEventListener('click',()=>$('#nBub').classList.remove('on'));
 badge();narrColoca();narrEstado();
 if('speechSynthesis' in window){elegirVoz();speechSynthesis.onvoiceschanged=elegirVoz}}
function badge(){const b=$('#nSp');if(b)b.textContent=NR.voz?'🔊':'🔇'}
function say(k,v){if(!P?.cfg?.narrOn||!$('#nBub'))return;let t=tpl(P.cfg.narr?.[k],v||nv()).trim();if(!t)return;t=t[0].toUpperCase()+t.slice(1);NR.last=t;NR.lastKey=k;show(t,k)}
const repetir=()=>show(NR.last,NR.lastKey);
/* Si el dueño grabó su voz para esa frase, suena la grabación; si no, la voz del celular (grave). */
function show(t,k){if(!t||NR.off)return;const b=$('#nBub'),av=$('#nAv');if(!b)return;
 b.innerHTML=`<b>${esc(P.cfg.narrNombre||'')}</b>${esc(t)}`;b.classList.add('on');av.classList.add('talk');
 clearTimeout(NR.hide);const ms=Math.max(3500,t.length*65);NR.hide=setTimeout(()=>{b.classList.remove('on');av.classList.remove('talk')},ms);
 try{speechSynthesis?.cancel()}catch(_){}NR.audio.pause();
 if(!NR.voz){setTimeout(()=>av.classList.remove('talk'),1600);return}
 const tts=()=>{if(!('speechSynthesis' in window)){av.classList.remove('talk');return}try{const u=new SpeechSynthesisUtterance(t.replace(/S\/\s?(\d+(?:\.\d+)?)/g,'$1 soles').replace(/(\d{3}) (\d{3}) (\d{3})/g,'$1, $2, $3').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,''));
  u.lang=NR.voice?.lang||'es-PE';if(NR.voice)u.voice=NR.voice;u.pitch=Math.min(2,Math.max(0,+P.cfg.narrTono||.5));u.rate=(+P.cfg.narrRate||1)*.93;u.onend=()=>av.classList.remove('talk');speechSynthesis.speak(u)}catch(e){}};
 const ak=k&&P.cfg.narrAudio?.[k];
 if(ak)API.audioUrl(ak).then(u=>{NR.audio.src=u;NR.audio.onended=()=>av.classList.remove('talk');return NR.audio.play()}).catch(tts);else tts()}

/* =================== INICIO =================== */
splashInit();
function linkBloqueado(t,m){$('#app').innerHTML=`<div class="ok"><b>🔒</b><h2>${t}</h2><p style="color:var(--mu)">${m}</p></div><div class="foot">${P.cfg.whatsapp?`<button class="btn g" onclick="window.open('https://wa.me/${waNum(P.cfg.whatsapp)}','_blank')">💬 Escribir a la barbería</button>`:''}<button class="btn" onclick="location.href=location.pathname">Reservar normal</button></div>`}
async function cargarLink(){const t=new URLSearchParams(location.search).get('l');if(!t)return true;let l=null;try{l=await API.link(t)}catch(e){}
 if(!l){linkBloqueado('Link no válido','Este link no existe o fue eliminado.');return false}
 if(l.estado==='usado'){linkBloqueado('Este link ya fue usado ✅','Cada link personal sirve para una sola reserva.');return false}
 if(l.vence&&l.vence<Date.now()){linkBloqueado('Este link ya venció ⌛','Pide uno nuevo a la barbería, sobrino.');return false}
 F.link=l;if(l.cliente?.nombre)F.cli={...F.cli,nombre:l.cliente.nombre,...(l.cliente.tel?{tel:l.cliente.tel}:{})};
 if(l.servicioId&&P.servicios.find(x=>x.id===l.servicioId))F.serv=l.servicioId;if(l.barberoId&&P.barberos.find(x=>x.id===l.barberoId))F.barb=l.barberoId;
 F.step=F.serv&&F.barb?2:F.serv?1:0;return true}
(async function(){try{P=await API.publico();if(P.ts)CONFIG.TURNSTILE_SITEKEY=P.ts;hero();const cc=(new URLSearchParams(location.search).get('c')||'').toUpperCase();let ok,est=null;
  if(/^[A-Z0-9]{6}$/.test(cc)){try{F.codigo=cc;F.info=est=await API.estado(cc);F.step=6;render();ok=false}catch(e){$('#app').innerHTML=`<div class="ok"><b>🔎</b><h2>No encontramos esa cita</h2><p style="color:var(--mu)">${esc(e.message)}. Revisa tu código o reserva de nuevo.</p></div>${P.cfg.whatsapp?`<div class="foot"><button class="btn g" onclick="window.open('https://wa.me/${waNum(P.cfg.whatsapp)}','_blank')">💬 Escribir a la barbería</button></div>`:''}`;ok=false}}else{ok=await cargarLink();if(ok)render()}
  narrInit();splashListo();if(est)setTimeout(()=>say('estado_'+est.estado,nvEst(est)),SPL.cfg?.splashOn===false?300:1800);else if(ok)setTimeout(()=>say(F.link?.cliente?.nombre?'holaLink':'hola'),SPL.cfg?.splashOn===false?300:1800)}catch(e){splashListo();$('#app').innerHTML=`<div class="empty">⚠️ No pudimos cargar la agenda.<br>${esc(e.message)}<br><br><button class="btn" style="margin:auto" onclick="location.reload()">Reintentar</button></div>`}})();
</script>
