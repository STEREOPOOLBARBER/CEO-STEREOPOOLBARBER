<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0812">
<title>Aviso de privacidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0812;--card:#15101f;--card2:#1d1530;--line:#33264a;--tx:#f3eefc;--mu:#a397b8;--blue:#8a3ffc;--pur:#ff3fd2;--grn:#3fb950;--red:#f85149;--yel:#d29922;--org:#f0883e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 'DM Sans',system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 30px;min-height:100vh;display:flex;flex-direction:column}
.hero{display:flex;align-items:center;gap:12px;padding:18px 0 6px}
.logo{overflow:hidden;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--pur));display:grid;place-items:center;font-size:30px;flex:none}
.hero h1{font:800 22px/1.1 'Syne'}
.hero p{color:var(--mu);font-size:13px;margin-top:3px}
.hero a{color:var(--blue);text-decoration:none}
.prog{display:flex;gap:6px;margin:14px 0 4px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.prog i.on{background:linear-gradient(90deg,var(--blue),var(--pur))}
.pt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:10px 0 2px}
h2{font:800 24px 'Syne';margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.opt.on{border-color:var(--blue);background:rgba(138,63,252,.08)}
.opt .em{width:60px;height:60px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:30px;flex:none;overflow:hidden}
.opt .em img{width:100%;height:100%;object-fit:cover}
.opt .em.round{border-radius:50%}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:16px}
.opt .t small{color:var(--mu);font-size:13px}
.opt .pr{font:800 17px 'Syne';color:var(--grn)}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:66px;padding:10px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:center}
.day b{display:block;font:800 22px 'Syne'}
.day small{font-size:11px;color:var(--mu);text-transform:uppercase;font-weight:700}
.day.on{background:var(--blue);border-color:var(--blue)}.day.on small{color:#fff}
.day:disabled{opacity:.3;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:14px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.slot.on{background:var(--blue);border-color:var(--blue);color:#fff}
.slot:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.lb{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:14px 0 6px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}
.in:focus{border-color:var(--blue)}
.pre{display:flex}.pre span{padding:13px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--card2);color:var(--mu)}.pre .in{border-radius:0 12px 12px 0}
.upl{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:12px;cursor:pointer}
.upl input{display:none}
.upl .prev{width:64px;height:64px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none}
.upl .prev img{width:100%;height:100%;object-fit:cover}
.foot{position:sticky;bottom:0;margin-top:auto;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;flex:1}
.btn.g{background:#238636;border-color:#2ea043;color:#fff;flex:1}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.res{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px}
.res span:nth-child(odd){color:var(--mu)}
.pay{background:linear-gradient(135deg,rgba(255,63,210,.18),rgba(138,63,252,.12));border:1px solid var(--pur);border-radius:20px;padding:18px;text-align:center}
.amt{font:800 46px/1 'Syne';color:var(--pur);margin:6px 0}
.ynum{font:800 26px 'Syne';letter-spacing:.04em}
.timer{font:800 28px 'Syne';color:var(--yel)}
.copy{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;margin-top:6px}
.qr{width:180px;border-radius:14px;margin:12px auto 0;display:block;background:#fff}
.ok{text-align:center;padding:20px 0}
.ok b{font-size:70px;display:block}
.code{font:800 30px 'Syne';letter-spacing:.15em;color:var(--blue)}
.err{color:var(--red);font-size:13px;margin-top:6px;min-height:18px}
.warn{background:rgba(210,153,34,.1);border:1px solid var(--yel);color:var(--yel);border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:99px;font-weight:700;z-index:80;transition:.3s;max-width:92%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mu);margin-top:14px}
.chk input{width:20px;height:20px;accent-color:var(--blue);flex:none;margin-top:1px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* pantalla de carga */
#splash{position:fixed;inset:0;z-index:100;background-color:#000;transition:background-color .9s,opacity .5s}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
#splash.glow canvas{animation:glow 1.3s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 0 rgba(255,200,60,0)) brightness(1)}to{filter:drop-shadow(0 0 18px rgba(255,200,60,.45)) brightness(1.12)}}
#splash .ld{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:120px;height:3px;border-radius:3px;background:#222;overflow:hidden}
#splash .ld::after{content:'';position:absolute;inset:0;width:40%;background:linear-gradient(90deg,#b8860b,#ffd76a,#b8860b);animation:ldm 1s ease-in-out infinite}
@keyframes ldm{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
/* narrador */
#narr{position:fixed;left:6px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:flex-end;gap:8px;pointer-events:none;transition:bottom .25s}
#narr .av{width:92px;height:92px;background:center/contain no-repeat;filter:drop-shadow(0 6px 12px rgba(0,0,0,.7));pointer-events:auto;cursor:pointer;flex:none;position:relative;display:grid;place-items:center;font-size:26px;touch-action:none;-webkit-user-select:none;user-select:none;transition:.2s}
#narr .av.talk{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px) scale(1.04)}}
#narr .sp{position:absolute;right:2px;top:2px;font-size:12px;background:#000;border:1px solid #e01b1b;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
#narr .bub{max-width:min(68vw,290px);background:#15101f;border:1px solid #e01b1b;color:#fff;padding:10px 12px;border-radius:16px 16px 16px 4px;font-size:14px;font-weight:600;line-height:1.35;opacity:0;transform:translateY(8px) scale(.96);transform-origin:bottom left;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#narr .bub.on{opacity:1;transform:none;pointer-events:auto}
#narr .bub b{display:block;font:800 11px 'Syne';letter-spacing:.08em;text-transform:uppercase;color:#ff4d4d;margin-bottom:2px}
#narr{display:block;width:92px;height:92px}
#narr .av{position:absolute;left:0;top:0}
#narr .bub{position:absolute;left:calc(100% + 8px);bottom:6px;width:max-content}
#narr.rev .bub{left:auto;right:calc(100% + 8px);border-radius:16px 16px 4px 16px;transform-origin:bottom right}
#narr.top .bub{bottom:auto;top:6px}
#narr.off{display:none}
#narr.drag .av{cursor:grabbing;filter:drop-shadow(0 12px 18px rgba(0,0,0,.8));transform:scale(1.06)}
#nArm{position:fixed;left:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;width:48px;height:48px;border-radius:0 24px 24px 0;background:#15101f;border:1px solid #e01b1b;border-left:0;font-size:24px;display:none;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.5);cursor:pointer;transition:bottom .25s}
.est{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:6px 0 14px}.est b.i{font-size:54px;line-height:1}.est h2{margin:4px 0 0}.est .fl{font:800 22px 'Syne';margin-top:6px}
.mapa{padding:10px}.mapa iframe{width:100%;height:230px;border:0;border-radius:12px;background:#222;display:block}.mapa .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mapa a.btn{text-decoration:none;color:var(--tx);font-size:14px;padding:12px}
.wrap{padding-bottom:90px}
</style>
<style>.priv h3{font-size:16px;margin:18px 0 6px}.priv p,.priv li{font-size:14px;line-height:1.55;color:var(--tx)}.priv ul{padding-left:20px;margin:6px 0}</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero"><div class="logo">💈</div><div><h1>Aviso de privacidad</h1></div></header>
  <div id="app" class="priv"><div class="spin"></div></div>
</div>
<script src="js/privacidad.js"></script>
</body>
</html>
