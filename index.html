<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0812">
<title>Barbería · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0b0812;--card:#15101f;--card2:#1d1530;--line:#33264a;--tx:#f3eefc;--mu:#a397b8;--blue:#8a3ffc;--pur:#ff3fd2;--grn:#3fb950;--red:#f85149;--yel:#d29922;--org:#f0883e;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 'DM Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.syne{font-family:'Syne',sans-serif}
/* header */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 14px;height:78px}
.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--pur));display:grid;place-items:center;font-size:28px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand{flex:1;min-width:0}
.brand h1{font:800 20px 'Syne';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--mu);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap}
.ibtn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:19px;position:relative;flex:none}
.ibtn .dot{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.ibtn.out{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.08)}
.ibtn.bare{border:0;background:none}
.tabs{position:sticky;top:78px;z-index:29;display:flex;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:14px 6px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font-weight:500;white-space:nowrap;font-size:16px}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
main{padding:14px;max-width:760px;margin:0 auto;padding-bottom:120px}
.sec{display:none}.sec.on{display:block}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 8px;text-align:center;cursor:pointer}
.stat b{display:block;font:800 40px/1.05 'Syne'}
.stat span{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
/* search + chips */
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 14px;flex:1}
.search input{flex:1;background:none;border:0;outline:none;padding:13px 0;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:13px;white-space:nowrap;text-transform:uppercase}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid var(--blue);color:var(--blue);background:rgba(138,63,252,.08)}
.fchip.x{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.08)}
.days{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;padding:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:center;position:relative}
.day b{display:block;font:800 20px 'Syne'}
.day small{font-size:10px;color:var(--mu);text-transform:uppercase;font-weight:700}
.day.on{background:var(--blue);border-color:var(--blue)}.day.on small{color:#fff}
.day i{position:absolute;top:-6px;right:-4px;background:var(--pur);color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.day.cal{display:grid;place-items:center;font-size:22px;overflow:hidden}
.day.cal input{position:absolute;inset:0;opacity:0}
.tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tool{width:54px;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:24px;display:grid;place-items:center}
.tool.p{background:var(--blue);border-color:var(--blue)}
.tool.pu{background:rgba(255,63,210,.15);border-color:var(--pur)}
/* grupos y tarjetas */
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:12px;padding:15px 14px;border-bottom:1px solid var(--line)}
.grp-h .bar{width:5px;height:30px;border-radius:4px}
.grp-h h3{font:800 18px 'Syne';flex:1;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{border:1px solid var(--line);border-radius:10px;padding:3px 11px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--card2);display:grid;place-items:center;flex:none;font-size:17px}
.av.lg{width:48px;height:48px;font-size:22px}
.cita{padding:16px 14px;border-bottom:1px solid var(--line)}
.cita:last-child{border-bottom:0}
.cn{font-weight:700;font-size:19px;flex:1;min-width:0;line-height:1.2}
.rb{width:46px;height:46px;border-radius:50%;border:1px solid #2ea04366;background:rgba(46,160,67,.1);display:grid;place-items:center;font-size:19px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 4px;font-size:15px}
.meta .lk{color:var(--blue);cursor:pointer}
.sub2{color:var(--mu);font-size:14px;text-transform:uppercase;margin-top:2px}
.nota{color:var(--pur);font-size:14px;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;color:var(--mu);background:var(--bg)}
.tag.lk{color:var(--blue);cursor:pointer}
.box{border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));background:color-mix(in srgb,var(--blue) 5%,var(--card));border-radius:16px;padding:12px;margin-top:12px}
.box h5{font:700 12px 'DM Sans';letter-spacing:.1em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.box h5 span{flex:1}
.phs3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phs3 .ph{aspect-ratio:3/4;font-size:12px}
.phs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph{position:relative;aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--mu);font-size:13px;font-weight:700;cursor:pointer;overflow:hidden;background:var(--bg);text-align:center}
.ph input{display:none}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .tg{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);padding:2px 8px;border-radius:99px;font-size:11px;color:#fff;z-index:1}
.ph .re{position:absolute;right:6px;bottom:6px;z-index:1;background:rgba(0,0,0,.7);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px}
.acts{display:flex;gap:10px;margin-top:14px;align-items:stretch}
.big{flex:1;border-radius:14px;padding:13px 10px;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;border:1.5px solid;text-align:center;line-height:1.25}
.sq{width:54px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:20px;display:grid;place-items:center;flex:none}
.sq.r{border-color:#f8514966;background:rgba(248,81,73,.08)}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
.empty b{display:block;font-size:42px;margin-bottom:8px}
.banner{border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px;border:1px solid var(--yel);color:var(--yel);background:rgba(210,153,34,.08)}
.banner.pu{border-color:var(--pur);color:var(--tx);background:rgba(255,63,210,.1)}
.banner .row{margin-top:10px}
/* forms */
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;min-width:0}
.in:focus{border-color:var(--blue)}
textarea.in{resize:vertical;font-size:14px}
.lb{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:14px 0 6px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.g{background:#238636;border-color:#2ea043;color:#fff}
.btn.pu{background:rgba(255,63,210,.15);border-color:var(--pur);color:var(--pur)}
.btn.r{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.08)}
.btn.w{width:100%}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--mu);margin-top:10px}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{padding:11px 0;width:calc(25% - 6px);border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.dchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t small{color:var(--mu)}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;border:0}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--blue)}.sw.on::after{left:24px}
.pre{display:flex}.pre span{padding:12px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--card2);color:var(--mu)}.pre .in{border-radius:0 12px 12px 0}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.swc{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swc.on{border-color:#fff}
.upl{display:flex;align-items:center;gap:12px;cursor:pointer}
.upl .prev{width:64px;height:64px;border-radius:14px;background:var(--card2);display:grid;place-items:center;overflow:hidden;font-size:28px;flex:none}
.upl .prev img{width:100%;height:100%;object-fit:cover}
.upl input{display:none}
.vars{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.vars button{font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--blue)}
/* config acordeón */
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;padding:16px;background:none;border:0;text-align:left}
.acc>button b{flex:1;font:700 13px 'DM Sans';letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.acc>button small{color:var(--mu);font-size:12px;display:block;letter-spacing:0;text-transform:none;font-weight:500;margin-top:2px}
.acc>button i{font-style:normal;color:var(--mu);transition:.2s}
.acc.open>button i{transform:rotate(90deg)}
.acc{scroll-margin-top:150px}
.acc>div{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc.open>div{grid-template-rows:1fr}
.acc .accb{overflow:hidden;padding:0 16px;min-height:0}
.acc.open .accb{padding-bottom:16px}
.acc>button i{font-size:20px}
#cfgSave.pend{box-shadow:0 0 0 3px rgba(63,185,80,.35);animation:pp 1.6s ease-in-out infinite}
@keyframes pp{50%{box-shadow:0 0 0 6px rgba(63,185,80,.12)}}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:25;display:none}
.savebar.on{display:block}
.savebar .btn{max-width:732px;margin:0 auto;display:flex;width:100%;font-size:17px;padding:15px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,5,14,.78);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:680px;max-height:94vh;overflow:auto;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font:800 21px 'Syne';margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:none;border:0;font-size:22px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:99px;font-weight:700;z-index:80;transition:.3s;max-width:92%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.login .logo{width:80px;height:80px;font-size:42px;border-radius:24px;margin-bottom:14px}
.login h2{font:800 26px 'Syne'}
.pin{font:800 28px 'Syne';letter-spacing:.4em;text-align:center;max-width:260px;margin:22px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.n{text-align:right}
.stamps{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.stamps i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:10px}
.stamps i.on{background:var(--pur);border-color:var(--pur)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.gal div{position:relative}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--card2);display:block}
.gal span{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);font-size:10px;padding:1px 7px;border-radius:99px}
.qr{background:#fff;padding:14px;border-radius:16px;width:max-content;margin:14px auto}
.url{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;word-break:break-all;font-size:14px;color:var(--blue);margin:10px 0}
.stp{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
/* dashboard */
.bars .br{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;padding:7px 0;cursor:pointer}
.bars .br span{font-size:14px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .br i{display:block;height:12px;border-radius:99px;background:var(--bg);overflow:hidden}
.bars .br i b{display:block;height:100%;border-radius:99px;min-width:4px}
.bars .br em{font-style:normal;color:var(--mu);font-weight:700;min-width:36px;text-align:right}
.bars .dt{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:2px 0 8px;font-size:13px;color:var(--mu)}
.bars .dt .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.bars .dt .r b{color:var(--tx);font-weight:600}
.dsec{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.dsec h6{font:700 12px 'DM Sans';letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.top10 .tr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.top10 .tr:last-child{border-bottom:0}
.top10 .tr>b:first-child{color:var(--mu);width:18px}
.top10 .tr .t{flex:1;min-width:0}.top10 .tr .t div{font-weight:700;text-transform:uppercase;font-size:15px}.top10 .tr .t small{color:var(--mu)}
.top10 .tr em{font:800 22px 'Syne';color:var(--blue);font-style:normal}.top10 .tr em small{font:500 12px 'DM Sans';color:var(--mu)}
.kp small{display:block;font-size:11px;color:var(--mu);margin-top:4px}
.mn h4{font:700 13px 'DM Sans';letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}
.cols{background:color-mix(in srgb,var(--blue) 8%,var(--card));border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));border-radius:14px;padding:12px;font-size:13px;color:var(--mu);line-height:1.8}
.lnk{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.lnk .row b{flex:1;font-size:17px}
.st{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid}
/* próximas / chips / usuarios */
.chiprow{display:flex;gap:8px;align-items:flex-start;padding-top:12px}
.chiprow>.chip{flex:none;position:relative;z-index:1;box-shadow:8px 0 10px -2px var(--card)}
.chiprow .chips{padding-top:0;flex:1;min-width:0}
.chiprow.all{flex-wrap:wrap}.chips.wrap{display:contents}
.chip .cc{font-style:normal;margin-left:6px;background:rgba(255,255,255,.12);border-radius:99px;padding:1px 7px;font-size:11px}
.next{background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 16%,var(--card)),color-mix(in srgb,var(--pur) 14%,var(--card)));border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line));border-radius:var(--r);padding:14px;margin-bottom:12px}
.next .lbl{font:700 12px 'DM Sans';letter-spacing:.12em;color:var(--blue);flex:1}
.next .big2{font:800 26px 'Syne'}
.next.late{border-color:var(--red);background:rgba(248,81,73,.08)}.next.late .big2,.next.late .lbl{color:var(--red)}
.tag.cd{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.tag.cd.late{color:var(--red);border-color:var(--red)}
.gnx{font:500 12px 'DM Sans';color:var(--mu);display:block;text-transform:none;letter-spacing:0}
.perm{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.perm span{flex:1}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.chr{display:inline-flex;align-items:center;gap:6px;font:800 15px 'Syne';letter-spacing:.04em;padding:6px 12px;border-radius:12px;border:1.5px solid var(--blue);color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);font-variant-numeric:tabular-nums;cursor:pointer}
.chr.run{border-color:var(--grn);color:var(--grn);background:rgba(63,185,80,.1)}
.chr.warn{border-color:var(--yel);color:var(--yel);background:rgba(210,153,34,.1)}
.chr.late{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.1)}
.chr.done{border-color:var(--line);color:var(--mu);background:var(--bg)}
.chr.run::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.et{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;width:100%;padding:18px 16px;border-radius:16px;border:1.5px solid;margin-bottom:10px;text-align:left;font-weight:800;font-size:16px;text-transform:uppercase}
.et span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et em{font-style:normal;font-weight:700;color:var(--org);text-transform:none}
.et b{font-weight:600;min-width:28px;text-align:right}

<script>
/* =====================================================================
   BARBERÍA · PANEL DE CONTROL  (index.html)
   Modo nube:  publicado en Cloudflare usa la API /api (worker/index.js):
               datos en D1, fotos en R2, login con PIN.
   Modo local: abierto como archivo o en GitHub Pages, los datos viven en
               este navegador (localStorage + IndexedDB para fotos).
   La sesión viaja en una cookie segura; el rol y los permisos SIEMPRE

const CONFIG={API_URL:/^https?:$/.test(location.protocol)&&!/(^|\.)github\.io$/.test(location.hostname)?'/api':'',FORM_URL:'reservar.html',POLL_MS:20000,DUR:60};

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const hoy=()=>ymd(new Date());
const toMin=h=>{if(!h)return null;const[a,b]=h.split(':').map(Number);return a*60+b};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],DIASL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],ORDEN=[1,2,3,4,5,6,0];
const fLarga=s=>{const d=pYmd(s);return `${DIASL[d.getDay()]} ${d.getDate()} de ${MES[d.getMonth()]}`};
const h12=h=>{if(!h)return'';let[H,M]=h.split(':').map(Number);const ap=H>=12?'p.m.':'a.m.';H=H%12||12;return `${H}:${pad(M)} ${ap}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const codigo=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const soles=n=>{n=Number(n)||0;return 'S/ '+(n%1?n.toFixed(2):n)};
const telKey=t=>String(t||'').replace(/\D/g,'').slice(-9);
const waNum=t=>{let d=String(t||'').replace(/\D/g,'');if(d.length===9)d='51'+d;return d};
const abrirWA=(t,msg)=>window.open(`https://wa.me/${waNum(t)}?text=${encodeURIComponent(msg)}`,'_blank');
const lsGet=(k,d)=>{try{const v=localStorage.getItem('brb_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem('brb_'+k,JSON.stringify(v));return true}catch(e){toast('⚠️ Memoria llena: exporta un respaldo');return false}};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)}
function copiar(txt){navigator.clipboard?.writeText(txt).then(()=>toast('📋 Copiado')).catch(()=>prompt('Copia:',txt))}

/* ---------- fotos ---------- */
const IDB={_db:null,open(){return this._db||(this._db=new Promise((res,rej)=>{const r=indexedDB.open('brb_fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=()=>res(k);t.onerror=()=>rej(t.error)})},
 async get(k){const db=await this.open();return new Promise(res=>{const r=db.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}};
function compressImg(file,max=1000,q=.72,type='image/jpeg'){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL(type,q))};img.onerror=()=>rej(new Error('Imagen no válida'));img.src=url})}
const FOTO_CACHE=new Map();

/* ---------- valores por defecto (todo editable en ⚙️ Config) ---------- */

const DEF_CFG={nombre:'Stereo Barber Pool',eslogan:'Barber · Pool · Lima',logo:'🎱',logoImg:'',acento:'#8a3ffc',acento2:'#ff3fd2',

 modAdelanto:true,yapeNum:'',yapeTitular:'',yapeQR:'',adelanto:10,holdMin:20,

 narrOn:true,narrNombre:'Tío Stereo',narrImg:'',narrVoz:false,narrRate:1,splashOn:true,splashImg:'',splashMelt:true,
 narr:{holaLink:'¡Qué tal, sobrino {cliente}! Este link es solo para ti 💪 Elige tu corte.',hola:'¡Qué tal, sobrino! Soy el {narrador} 💪 Elige tu corte y yo te guío.',servicio:'¡Buena elección, sobrino! {servicio}, {precio}. Ahora elige a tu barbero.',barbero:'{barbero} te va a dejar fino, sobrino. {especialidad} 💪',cualquiera:'Tranqui sobrino, te asigno al primero que esté libre. Elige día y hora.',dia:'{fecha}. ¿A qué hora te acomoda, sobrino?',hora:'{fecha} a las {hora} ✅ Ese turno ya es casi tuyo, sobrino.',datos:'Listo {cliente}, yapea {adelanto} al {yape} y sube la captura, sobrino.',listo:'¡Reserva hecha, sobrino {cliente}! Nos vemos el {fecha} a las {hora} 🔥',ocupado:'Uy sobrino, te ganaron ese turno. Elige otro.',vencido:'Se acabó el tiempo, sobrino, pero tranqui: reserva de nuevo.'},
 est:{},adminPin:'1234',bloqueos:[]};
const DEF_BARB=()=>[['Jhon','Fades y degradados'],['Brayan','Diseños y freestyle'],['Piero','Cortes clásicos'],['Alexis','Barba y perfilado'],['Renzo','Taper y mullet']].map(([n,e],i)=>({id:'b'+(i+1),nombre:n,esp:e,foto:'',color:COLORES[i],pin:String(i+1).repeat(4),comision:50,dias:[1,2,3,4,5,6],activo:true}));
const DEF_SERV=()=>[
 {id:'s1',emoji:'✂️',nombre:'Corte clásico',precio:25,desc:'Tijera y máquina, acabado limpio',foto:'',activo:true},

 {id:'s3',emoji:'💈',nombre:'Taper',precio:30,desc:'Degradado suave en patillas y nuca',foto:'',activo:true},

function demoCitas(){const h=hoy(),m=addD(h,1),sv=DEF_SERV(),mk=(f,hr,b,s,nom,tel,ciu,est,x={})=>({id:'demo_'+uid(),codigo:codigo(),creada:Date.now(),demo:true,fecha:f,hora:hr,barberoId:b,servicioId:sv[s].id,servicioNombre:sv[s].nombre,precio:sv[s].precio,cliente:{nombre:nom,tel,ciudad:ciu},nota:'',estado:est,adelanto:10,adelantoOk:['confirmada','en_silla','atendida'].includes(est),origen:'web',...x});
 return[mk(h,'09:00','b1',1,'Carlos Ramírez Quispe','987654321','Puente Piedra','atendida'),
  mk(h,'10:00','b1',3,'Luis Fernando Torres','912345678','Carabayllo','en_silla',{nota:'Mid fade, dejar volumen arriba'}),
  mk(h,'11:00','b1',1,'Jhon Paredes Huamán','998877665','Comas','por_validar'),
  mk(h,'15:00','b1',0,'Kevin Rojas Silva','955443322','Los Olivos','confirmada'),
  mk(h,'10:00','b2',5,'Miguel Ángel Flores','944556677','Puente Piedra','confirmada',{nota:'Diseño de rayo al costado'}),
  mk(h,'12:00','b2',2,'Diego Salazar Chávez','966778899','Ancón','pendiente_pago',{expira:Date.now()+14*60000}),
  mk(h,'09:00','b3',4,'Bryan Mendoza Ríos','933221100','Puente Piedra','no_vino'),
  mk(h,'16:00','b3',0,'Renzo Castillo Vega','977665544','Comas','confirmada',{adelanto:0,adelantoOk:false,origen:'panel'}),
  mk(m,'10:00','b1',1,'Carlos Ramírez Quispe','987654321','Puente Piedra','confirmada'),
  mk(m,'11:00','b4',3,'Anthony Gutiérrez','921098765','Santa Rosa','por_validar')]}
function seed(){if(!lsGet('cfg',null))lsSet('cfg',DEF_CFG);if(!lsGet('barberos',null))lsSet('barberos',DEF_BARB());if(!lsGet('servicios',null))lsSet('servicios',DEF_SERV());if(!lsGet('citas',null))lsSet('citas',demoCitas())}
const mergeCfg=c=>({...DEF_CFG,...c,est:{...(c?.est||{})},narr:{...DEF_CFG.narr,...(c?.narr||{})}});

/* ---------- reglas del negocio ---------- */
const ACTIVOS=['pendiente_pago','por_validar','confirmada','en_silla','atendida'];
const activa=(c,now=Date.now())=>ACTIVOS.includes(c.estado)&&!(c.estado==='pendiente_pago'&&c.expira&&c.expira<now);
function slotsDia(cfg){const out=[],dur=CONFIG.DUR,fin=toMin(cfg.cierre),ri=toMin(cfg.refIni),rf=toMin(cfg.refFin);let t=toMin(cfg.apertura),g=0;if(t==null||fin==null)return out;while(t+dur<=fin&&g++<60){if(ri!=null&&rf!=null&&rf>ri&&t<rf&&t+dur>ri){t=rf;continue}out.push(fromMin(t));t+=dur}return out}
const bloqueado=(cfg,f,bid)=>(cfg.bloqueos||[]).some(b=>b.fecha===f&&(!b.barberoId||b.barberoId===bid));

/* ---------- API (local ahora, Cloudflare después) ---------- */
const API={
 get remote(){return !!CONFIG.API_URL},
 async req(m,p,b){const r=await fetch(CONFIG.API_URL+p,{method:m,credentials:'same-origin',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('brb_ses');location.reload()}if(!r.ok)throw new Error(j.error||('Error '+r.status));return j},
 async logout(){if(this.remote)await this.req('POST','/auth/logout').catch(()=>{})},

};

/* ---- tiempo para la próxima cita ---- */
const startTs=c=>{const[y,m,d]=c.fecha.split('-').map(Number),[H,M]=(c.hora||'00:00').split(':').map(Number);return new Date(y,m-1,d,H,M).getTime()};
function falta(ts){const m=Math.round((ts-Date.now())/60000);if(m>=0){if(m<1)return'ahora';if(m<60)return`en ${m} min`;const h=Math.floor(m/60),r=m%60;if(h<24)return`en ${h} h${r?' '+r+' min':''}`;const d=Math.round(m/1440);return d===1?'mañana':`en ${d} días`}const a=-m;return a<60?`hace ${a} min`:`hace ${Math.floor(a/60)} h`}
function cdLabel(ts){const m=Math.round((ts-Date.now())/60000);return m<-1?`⚠️ ${-m<60?-m+' min':Math.floor(-m/60)+' h'} tarde`:`⏳ ${falta(ts)}`}
const ESPERA=['confirmada','por_validar','pendiente_pago'];
const hms=x=>{x=Math.max(0,Math.floor(x));const h=Math.floor(x/3600),m=Math.floor(x%3600/60),z=x%60;return(h?pad(h)+':':'')+pad(m)+':'+pad(z)};
function chrono(c){const now=Date.now(),dur=CONFIG.DUR*60;
 if(c.estado==='en_silla'){const t0=c.enSillaTs||startTs(c);return `<span class="chr run" data-sw="${t0}" title="Tiempo en silla">${hms((now-t0)/1000)}</span>`}
 if(c.estado==='atendida'&&c.enSillaTs&&c.atendidaTs)return `<span class="chr done">⏱ ${hms((c.atendidaTs-c.enSillaTs)/1000)}</span>`;
 if(ESPERA.includes(c.estado)&&activa(c)){const ts=startTs(c),d=(ts-now)/1000;if(d>12*3600||d<-6*3600)return'';return `<span class="chr ${d<0?'late':d<900?'warn':''}" data-cdn="${ts}" ${can('crear')?`onclick="if(confirm('¿El cliente llegó? Iniciar cronómetro y pasarlo a silla'))setEstado('${c.id}','en_silla',{enSillaTs:Date.now()})"`:''}>${d<0?'⚠️ +'+hms(-d):'⏳ '+hms(d)}</span>`}return''}
function tickSec(){const now=Date.now(),dur=CONFIG.DUR*60;
 $$('[data-sw]').forEach(e=>{const t=(now-e.dataset.sw)/1000;e.textContent=hms(t);e.classList.toggle('warn',t>=dur-600&&t<dur);e.classList.toggle('late',t>=dur);e.classList.toggle('run',t<dur-600)});
 $$('[data-cdn]').forEach(e=>{const d=(e.dataset.cdn-now)/1000;e.textContent=d<0?'⚠️ +'+hms(-d):'⏳ '+hms(d);e.classList.toggle('late',d<0);e.classList.toggle('warn',d>=0&&d<900)})}
function cdTag(c){if(!ESPERA.includes(c.estado)||!activa(c))return c.estado==='en_silla'&&c.enSillaTs?`<span class="tag cd" data-silla="${c.enSillaTs}">💺 ${Math.max(1,Math.round((Date.now()-c.enSillaTs)/60000))} min en silla</span>`:'';const ts=startTs(c);if(ts-Date.now()>7*864e5||ts<Date.now()-12*36e5)return'';return `<span class="tag cd ${ts<Date.now()-60000?'late':''}" data-cd="${ts}">${cdLabel(ts)}</span>`}
function gNext(bid){const now=Date.now(),cs=S.citas.filter(c=>c.barberoId===bid&&c.fecha===hoy()&&activa(c));const silla=cs.find(c=>c.estado==='en_silla');const nx=cs.filter(c=>ESPERA.includes(c.estado)&&startTs(c)>now-15*60000).sort((a,b)=>startTs(a)-startTs(b))[0];
 return `<span class="gnx">${silla?'💺 Atendiendo a '+esc(silla.cliente?.nombre?.split(' ')[0]||'')+' · ':'🟢 Libre · '}${nx?`próx. ${h12(nx.hora)} (<b data-cdt="${startTs(nx)}">${falta(startTs(nx))}</b>)`:'sin más citas hoy'}</span>`}
function proxima(){const now=Date.now();return scope().filter(c=>ESPERA.includes(c.estado)&&activa(c)&&startTs(c)>now-90*60000).sort((a,b)=>startTs(a)-startTs(b))[0]}

 el.innerHTML=`<div class="next ${late?'late':''}"><div class="row"><span class="lbl">${late?'⚠️ CLIENTE RETRASADO':'⏳ PRÓXIMA CITA'}</span><b class="big2" data-cdb="${ts}">${late?cdLabel(ts).replace('⚠️ ',''):falta(ts)}</b></div>

 ${late&&can('cancelar')?`<div class="row" style="margin-top:10px"><button class="btn sm" style="flex:1" onclick="setEstado('${c.id}','en_silla',{enSillaTs:Date.now()})">💺 Ya llegó</button><button class="btn sm r" style="flex:1" onclick="noVino('${c.id}')">❌ No vino</button></div>`:''}
 ${silla.length?`<p class="hint" style="margin-top:8px">💺 En silla: ${silla.map(x=>`${esc(x.cliente?.nombre?.split(' ')[0]||'')} con ${esc(barb(x.barberoId)?.nombre||'')}${x.enSillaTs?` (${Math.round((Date.now()-x.enSillaTs)/60000)} min)`:''}`).join(' · ')}</p>`:''}</div>`;hydrate(el)}

function renderLista(){
 let cs=scope();const q=S.q.trim().toLowerCase(),global=!!q||['por_validar','pendiente_pago'].includes(S.filtro);
 if(!global)cs=cs.filter(c=>c.fecha===S.fecha);
 if(S.barbF)cs=cs.filter(c=>c.barberoId===S.barbF);
 if(S.filtro==='cancelada')cs=cs.filter(c=>c.estado==='cancelada'||c.estado==='expirada');
 else if(S.filtro!=='todos')cs=cs.filter(c=>c.estado===S.filtro);
 else if(!q)cs=cs.filter(c=>c.estado!=='expirada');
 if(q)cs=cs.filter(c=>[c.cliente?.nombre,c.cliente?.tel,c.cliente?.ciudad,c.codigo,c.servicioNombre].join(' ').toLowerCase().includes(q));

function clientes(){const m={};scope().forEach(c=>{const k=telKey(c.cliente?.tel);if(!k)return;const o=m[k]||(m[k]={k,citas:[],ult:''});o.citas.push(c);if(c.fecha+c.hora>o.ult){o.ult=c.fecha+c.hora;o.nombre=c.cliente.nombre;o.tel=c.cliente.tel;o.ciudad=c.cliente.ciudad}});
 return Object.values(m).map(o=>{const at=o.citas.filter(c=>c.estado==='atendida');return{...o,vis:at.length,gasto:at.reduce((a,c)=>a+(c.gratis?0:+c.precio||0),0),nov:o.citas.filter(c=>c.estado==='no_vino').length,ultAt:at.map(c=>c.fecha).sort().pop()||''}}).sort((a,b)=>b.ult.localeCompare(a.ult))}
function stamps(v){const n=S.cfg.modFidelidad?+S.cfg.fidelidad||0:0;if(n<2)return'';const f=v%n;return `<div class="stamps">${Array.from({length:n},(_,i)=>`<i class="${i<f?'on':''}">${i===n-1?'🎁':''}</i>`).join('')}</div>`}
function abrirClientes(){openModal(mHead('👥 Clientes')+`<input class="in" placeholder="🔍 Buscar cliente o celular…" value="${esc(S.cliQ)}" oninput="S.cliQ=this.value;listaClientes()"><p class="hint" id="cliCount"></p><div id="cliList"></div>`);listaClientes()}

 $('#cliCount').textContent=`${tot} cliente(s)`;
 $('#cliList').innerHTML=cs.length?cs.map(c=>`<div class="li" style="cursor:pointer" onclick="histCliente('${c.k}')"><span class="av lg">👤</span><div class="t"><b>${esc(c.nombre)}</b><small>📞 ${esc(telV(c.tel))}${c.ciudad?' · 📍 '+esc(c.ciudad):''}<br>⭐ ${c.vis} visita(s) · ${soles(c.gasto)}${c.nov?` · <span style="color:var(--red)">❌ ${c.nov} falta(s)</span>`:''}</small>${stamps(c.vis)}</div><span style="color:var(--mu)">›</span></div>`).join(''):'<div class="empty"><b>👥</b>Aún no hay clientes</div>'}

 openModal(mHead('👤 '+esc(c.nombre))+`<p style="color:var(--mu)">📞 ${esc(telV(c.tel))}${c.ciudad?' · 📍 '+esc(c.ciudad):''}</p>
 <div class="stats" style="margin:12px 0"><div class="stat"><b style="color:var(--pur)">${c.vis}</b><span>Visitas</span></div><div class="stat"><b style="color:var(--grn);font-size:26px">${soles(c.gasto)}</b><span>Gastado</span></div></div>

/* =================== CAJA (ventana) =================== */
function ingresoCita(c){if(c.estado==='atendida')return c.gratis?(c.adelantoOk?+c.adelanto||0:0):+c.precio||0;if(c.estado==='no_vino')return c.adelantoOk?+c.adelanto||0:0;return 0}
function abrirCaja(){const f=S.cajaF,cs=scope().filter(c=>c.fecha===f),at=cs.filter(c=>c.estado==='atendida'),nv=cs.filter(c=>c.estado==='no_vino'),com=S.cfg.modComision;
 const total=cs.reduce((a,c)=>a+ingresoCita(c),0),yape=[...at,...nv].filter(c=>c.adelantoOk).reduce((a,c)=>a+(+c.adelanto||0),0),local=Math.max(0,total-yape),ret=nv.filter(c=>c.adelantoOk).reduce((a,c)=>a+(+c.adelanto||0),0);
 const filas=S.barberos.filter(b=>isAdmin()||b.id===S.ses.barberoId).map(b=>{const mc=cs.filter(c=>c.barberoId===b.id);const g=mc.reduce((a,c)=>a+ingresoCita(c),0),pago=com?Math.round(g*(+b.comision||0))/100:0;return{b,cortes:mc.filter(c=>c.estado==='atendida').length,g,pago,neto:g-pago}}).filter(r=>r.cortes||r.g);
 S._cajaTxt=`💈 *${S.cfg.nombre}* — Caja ${fLarga(f)}\n\n✔️ Cortes: ${at.length}\n💰 Total: ${soles(total)}\n💸 Yape (adelantos): ${soles(yape)}\n💵 Cobrado en local: ${soles(local)}\n❌ No vinieron: ${nv.length} (retenido ${soles(ret)})\n\n`+filas.map(r=>`• ${r.b.nombre}: ${r.cortes} cortes · ${soles(r.g)}${com?` · comisión ${soles(r.pago)}`:''}`).join('\n');
 openModal(mHead('📊 Caja del día')+`<div class="row"><button class="ibtn" onclick="S.cajaF=addD(S.cajaF,-1);abrirCaja()">◀</button><div style="flex:1;text-align:center;font-weight:700">${fLarga(f)}${f===hoy()?' · HOY':''}</div><button class="ibtn" onclick="S.cajaF=addD(S.cajaF,1);abrirCaja()">▶</button></div>
 <div class="stats" style="margin-top:12px"><div class="stat"><b style="color:var(--grn);font-size:28px">${soles(total)}</b><span>💰 Total</span></div><div class="stat"><b style="color:var(--pur)">${at.length}</b><span>✔️ Cortes</span></div><div class="stat"><b style="color:var(--org);font-size:28px">${soles(yape)}</b><span>💸 Yape</span></div><div class="stat"><b style="color:var(--blue);font-size:28px">${soles(local)}</b><span>💵 En local</span></div></div>
 ${nv.length?`<div class="banner" style="border-color:var(--red);color:var(--red);background:rgba(248,81,73,.08)">❌ ${nv.length} no vinieron · adelanto retenido ${soles(ret)}</div>`:''}
 ${filas.length?`<table><tr><th>Barbero</th><th class="n">Cortes</th><th class="n">Generó</th>${com?'<th class="n">Comisión</th>':''}${com&&isAdmin()?'<th class="n">Local</th>':''}</tr>
 ${filas.map(r=>`<tr><td>${esc(r.b.nombre)}${com?`<br><small style="color:var(--mu)">${+r.b.comision||0}%</small>`:''}</td><td class="n">${r.cortes}</td><td class="n">${soles(r.g)}</td>${com?`<td class="n" style="color:var(--pur)">${soles(r.pago)}</td>`:''}${com&&isAdmin()?`<td class="n">${soles(r.neto)}</td>`:''}</tr>`).join('')}</table>`:'<div class="empty"><b>🧾</b>Sin movimientos este día</div>'}
 ${isAdmin()?`<button class="btn g w" style="margin-top:14px" onclick="abrirWA(S.cfg.whatsapp,S._cajaTxt)">📤 Enviar resumen por WhatsApp</button>`:''}`)}

function resumenCitas(u){const now=Date.now(),act=S.citas.filter(c=>activa(c)&&c.estado!=='atendida'&&startTs(c)>now-30*60000);const mias=u.barberoId?act.filter(c=>c.barberoId===u.barberoId).sort((a,b)=>startTs(a)-startTs(b)):[];const hoyN=mias.filter(c=>c.fecha===hoy()).length,creo=S.citas.filter(c=>c.creadoPor===u.id).length;
 return (u.barberoId?`📅 ${mias.length} próximas · hoy ${hoyN}${mias[0]?` · siguiente <b style="color:var(--blue)">${falta(startTs(mias[0]))}</b>`:''}`:'')+(creo?`${u.barberoId?' · ':''}✍️ agendó ${creo}`:'')||'Sin citas'}
function verCitasDe(bid){const b=barb(bid)||D()?.barberos.find(x=>x.id===bid);const now=Date.now(),cs=S.citas.filter(c=>c.barberoId===bid&&activa(c)&&startTs(c)>now-30*60000&&c.estado!=='atendida').sort((a,b)=>startTs(a)-startTs(b));
 openModal(mHead('📅 Citas de '+esc(b?.nombre||''))+(cs.map(c=>`<div class="li"><div class="t"><b>${esc(c.cliente?.nombre)}</b><small>${fLarga(c.fecha)} · ${h12(c.hora)} · ✂️ ${esc(c.servicioNombre)}</small></div><span class="tag cd ${startTs(c)<now?'late':''}">${cdLabel(startTs(c))}</span></div>`).join('')||'<div class="empty"><b>📭</b>Sin citas próximas</div>'))}
function togUser(id){const u=D().usuarios.find(x=>x.id===id);u.activo=u.activo===false;dirty();renderConfig()}
function togPB(k){const c=D().cfg;c.permBarbero={...ROLES.barbero.p,...(c.permBarbero||{})};c.permBarbero[k]=!c.permBarbero[k];dirty();renderConfig()}
function editUser(id){const u=id?D().usuarios.find(x=>x.id===id):{id:'',nombre:'',pin:'',rol:'recepcion',barberoId:'',permisos:{...ROLES.recepcion.p},activo:true};S._u=clone(u);
 openModal(mHead(id?'✏️ Editar usuario':'➕ Nuevo usuario')+`
 <label class="lb">Nombre</label><input class="in" id="uNom" value="${esc(u.nombre)}" placeholder="Ej: Kiara (recepción)">
 <div class="g2"><div><label class="lb">PIN</label><input class="in" id="uPin" inputmode="numeric" maxlength="6" value="${esc(u.pin)}" placeholder="4-6 dígitos"></div><div><label class="lb">Rol</label><select class="in" id="uRol" onchange="rolUser(this.value)">${Object.entries(ROLES).filter(([k])=>k!=='dueno').map(([k,r])=>`<option value="${k}" ${u.rol===k?'selected':''}>${r.t}</option>`).join('')}</select></div></div>
 <label class="lb">Vincular a un barbero (ve sus citas)</label><select class="in" id="uBarb" onchange="S._u.barberoId=this.value"><option value="">— Ninguno —</option>${D().barberos.map(b=>`<option value="${b.id}" ${u.barberoId===b.id?'selected':''}>${esc(b.nombre)}</option>`).join('')}</select>
 <label class="lb">Permisos</label><div id="uPerms"></div>
 <button class="btn p w" style="margin-top:16px;padding:14px" onclick="saveUser()">💾 Listo</button>
 ${id?`<button class="btn r w" style="margin-top:8px" onclick="delUser('${id}')">🗑️ Eliminar usuario</button>`:''}`);uPerms()}
function uPerms(){$('#uPerms').innerHTML=PERMS.map(([k,t])=>`<div class="perm"><span>${t}</span>${sw(S._u.permisos[k],`S._u.permisos['${k}']=!S._u.permisos['${k}'];S._u.rol='personal';$('#uRol').value='personal';uPerms()`)}</div>`).join('')}
function rolUser(r){S._u.rol=r;if(r!=='personal')S._u.permisos={...ROLES[r].p};uPerms()}
function saveUser(){const u=S._u;u.nombre=$('#uNom').value.trim();u.pin=$('#uPin').value.replace(/\D/g,'');u.barberoId=$('#uBarb').value;
 if(!u.nombre)return toast('Falta el nombre');if(u.pin.length<4)return toast('El PIN debe tener 4 a 6 dígitos');
 const usados=[D().cfg.adminPin,...D().barberos.map(b=>b.pin),...D().usuarios.filter(x=>x.id!==u.id).map(x=>x.pin)];if(usados.includes(u.pin))return toast('Ese PIN ya lo usa otra persona');
 if(!Object.values(u.permisos).some(Boolean))return toast('Dale al menos un permiso');
 if(u.id){const i=D().usuarios.findIndex(x=>x.id===u.id);D().usuarios[i]=u}else{u.id='u'+uid();D().usuarios.push(u)}closeModal();dirty();renderConfig()}
function delUser(id){if(!confirm('¿Eliminar este usuario? Ya no podrá entrar.'))return;D().usuarios=D().usuarios.filter(x=>x.id!==id);closeModal();dirty();renderConfig()}
function tplPreview(s){return tpl(s,{fecha:hoy(),hora:'10:00',barberoId:D().barberos[0]?.id,servicioNombre:'Fade / Degradado',precio:30,codigo:'AB12CD',adelanto:D().cfg.adelanto,cliente:{nombre:'Carlos',tel:'987654321',ciudad:'Puente Piedra'}},D().cfg)}
const NKEYS=[['hola','👋 Al abrir'],['holaLink','🔗 Al abrir un link personalizado'],['servicio','✂️ Al elegir servicio'],['barbero','💈 Al elegir barbero'],['cualquiera','🎲 Si elige cualquier barbero'],['dia','📅 Al elegir día'],['hora','⏰ Al elegir hora'],['datos','💸 Antes de pagar'],['listo','✅ Reserva lista'],['ocupado','😕 Turno ocupado'],['vencido','⌛ Tiempo de pago vencido']];
const NVARS=['narrador','cliente','servicio','precio','barbero','especialidad','fecha','hora','adelanto','yape','negocio'];
function insVarN(k,v){const ta=$('#tn_'+k);const p=ta.selectionStart??ta.value.length;ta.value=ta.value.slice(0,p)+'{'+v+'}'+ta.value.slice(ta.selectionEnd??p);D().cfg.narr[k]=ta.value;dirty();ta.focus()}
async function subirImg(inp,key,max,type){const f=inp.files[0];if(!f)return;try{D().cfg[key]=await API.putFoto(await compressImg(f,max,.85,type));dirty();renderConfig()}catch(e){toast('❌ '+e.message)}}
function insVar(k,v){const ta=$('#ta_'+k);const p=ta.selectionStart??ta.value.length;ta.value=ta.value.slice(0,p)+'{'+v+'}'+ta.value.slice(ta.selectionEnd??p);setC(k,ta.value);ta.focus()}
function setEst(k,f,v){const e=D().cfg.est;e[k]={...(e[k]||{}),[f]:v.trim()||DEF_EST[k][f]};dirty()}
function togDia(x){const a=D().cfg.dias;const i=a.indexOf(x);i<0?a.push(x):a.splice(i,1);dirty();renderConfig()}
function togBarb(id){const b=D().barberos.find(x=>x.id===id);b.activo=b.activo===false;dirty();renderConfig()}
function togServ(id){const s=D().servicios.find(x=>x.id===id);s.activo=s.activo===false;dirty();renderConfig()}
async function subirLogo(inp){const f=inp.files[0];if(!f)return;try{D().cfg.logoImg=await API.putFoto(await compressImg(f,300,.85));dirty();renderConfig()}catch(e){toast('❌ '+e.message)}}
async function subirYapeQR(inp){const f=inp.files[0];if(!f)return;try{D().cfg.yapeQR=await API.putFoto(await compressImg(f,700,.85));dirty();renderConfig()}catch(e){toast('❌ '+e.message)}}
function addBloqueo(){const f=$('#blF').value;if(!f)return toast('Elige una fecha');D().cfg.bloqueos=[...(D().cfg.bloqueos||[]),{id:uid(),fecha:f,barberoId:$('#blB').value,motivo:$('#blM').value.trim()}];dirty();renderConfig()}
function delBloqueo(id){D().cfg.bloqueos=D().cfg.bloqueos.filter(b=>b.id!==id);dirty();renderConfig()}
function editBarbero(id){const b=id?D().barberos.find(x=>x.id===id):{id:'',nombre:'',esp:'',foto:'',color:COLORES[D().barberos.length%COLORES.length],pin:'',comision:50,dias:[...D().cfg.dias],activo:true};S._b=clone(b);
 openModal(mHead(id?'✏️ Editar barbero':'➕ Nuevo barbero')+`
 <label class="upl"><span class="prev" id="bPrev">${b.foto?`<img data-foto="${b.foto}">`:'💈'}</span><span class="btn sm">📷 Foto del barbero</span><input type="file" accept="image/*" onchange="fotoBarb(this)"></label>
 <label class="lb">Nombre</label><input class="in" id="bNom" value="${esc(b.nombre)}">
 <label class="lb">Especialidad (se ve en el formulario)</label><input class="in" id="bEsp" value="${esc(b.esp||'')}" placeholder="Ej: Fades y diseños">
 <label class="lb">Color en la agenda</label><div class="sws" id="bCol"></div>
 <div class="g2"><div><label class="lb">PIN de acceso</label><input class="in" id="bPin" inputmode="numeric" maxlength="6" value="${esc(b.pin)}" placeholder="4 dígitos"></div><div><label class="lb">Comisión %</label><input class="in" id="bCom" type="number" min="0" max="100" value="${b.comision}"></div></div>
 <label class="lb">Días que trabaja</label><div class="dchips" id="bDias"></div>
 <button class="btn p w" style="margin-top:16px;padding:14px" onclick="saveBarbero()">💾 Listo</button>
 ${id?`<button class="btn r w" style="margin-top:8px" onclick="delBarbero('${id}')">🗑️ Eliminar barbero</button>`:''}`);bDias();bCol()}
function bDias(){$('#bDias').innerHTML=ORDEN.map(x=>`<button class="dchip ${S._b.dias.includes(x)?'on':''}" onclick="S._b.dias.includes(${x})?S._b.dias.splice(S._b.dias.indexOf(${x}),1):S._b.dias.push(${x});bDias()">${DIAS[x]}</button>`).join('')}
function bCol(){$('#bCol').innerHTML=COLORES.map(x=>`<button class="swc ${S._b.color===x?'on':''}" style="background:${x}" onclick="S._b.color='${x}';bCol()"></button>`).join('')}
async function fotoBarb(inp){const f=inp.files[0];if(!f)return;try{S._b.foto=await API.putFoto(await compressImg(f,320,.8));$('#bPrev').innerHTML=`<img src="${await API.foto(S._b.foto)}">`}catch(e){toast('❌ '+e.message)}}
function saveBarbero(){const b=S._b;b.nombre=$('#bNom').value.trim();b.esp=$('#bEsp').value.trim();b.pin=$('#bPin').value.replace(/\D/g,'');b.comision=Math.min(100,Math.max(0,+$('#bCom').value||0));
 if(!b.nombre)return toast('Falta el nombre');if(b.pin.length<4)return toast('El PIN debe tener al menos 4 dígitos');
 if(b.pin===D().cfg.adminPin||D().barberos.some(x=>x.id!==b.id&&x.pin===b.pin)||(D().usuarios||[]).some(x=>x.pin===b.pin))return toast('Ese PIN ya está en uso');
 if(b.id){const i=D().barberos.findIndex(x=>x.id===b.id);D().barberos[i]=b}else{b.id='b'+uid();D().barberos.push(b)}closeModal();dirty();renderConfig()}
function delBarbero(id){const fut=S.citas.filter(c=>c.barberoId===id&&c.fecha>=hoy()&&activa(c)).length;if(!confirm(fut?`Tiene ${fut} cita(s) próximas. Mejor desactívalo con el interruptor. ¿Eliminar igual?`:'¿Eliminar este barbero?'))return;D().barberos=D().barberos.filter(b=>b.id!==id);closeModal();dirty();renderConfig()}
function editServicio(id){const s=id?D().servicios.find(x=>x.id===id):{id:'',emoji:'✂️',nombre:'',precio:25,desc:'',foto:'',activo:true};S._s=clone(s);
 openModal(mHead(id?'✏️ Editar servicio':'➕ Nuevo servicio')+`
 <label class="upl"><span class="prev" id="sPrev">${s.foto?`<img data-foto="${s.foto}">`:s.emoji}</span><span class="btn sm">📷 Foto de referencia</span><input type="file" accept="image/*" onchange="fotoServ(this)"></label>
 <div class="g2"><div><label class="lb">Emoji</label><input class="in" id="sEmo" value="${esc(s.emoji)}" maxlength="4"></div><div><label class="lb">Precio S/</label><input class="in" id="sPre" type="number" min="0" step="0.5" value="${s.precio}"></div></div>
 <label class="lb">Nombre</label><input class="in" id="sNom" value="${esc(s.nombre)}" placeholder="Ej: Mid Fade">
 <label class="lb">Descripción corta</label><input class="in" id="sDes" value="${esc(s.desc||'')}">
 <button class="btn p w" style="margin-top:16px;padding:14px" onclick="saveServicio()">💾 Listo</button>
 ${s.foto?`<button class="btn w" style="margin-top:8px" onclick="S._s.foto='';$('#sPrev').textContent=S._s.emoji">Quitar foto</button>`:''}
 ${id?`<button class="btn r w" style="margin-top:8px" onclick="delServicio('${id}')">🗑️ Eliminar servicio</button>`:''}`)}
async function fotoServ(inp){const f=inp.files[0];if(!f)return;try{S._s.foto=await API.putFoto(await compressImg(f,600,.78));$('#sPrev').innerHTML=`<img src="${await API.foto(S._s.foto)}">`}catch(e){toast('❌ '+e.message)}}
function saveServicio(){const s=S._s;s.emoji=$('#sEmo').value.trim()||'✂️';s.nombre=$('#sNom').value.trim();s.precio=Math.max(0,+$('#sPre').value||0);s.desc=$('#sDes').value.trim();if(!s.nombre)return toast('Falta el nombre');
 if(s.id){const i=D().servicios.findIndex(x=>x.id===s.id);D().servicios[i]=s}else{s.id='s'+uid();D().servicios.push(s)}closeModal();dirty();renderConfig()}
function delServicio(id){if(!confirm('¿Eliminar este servicio?'))return;D().servicios=D().servicios.filter(s=>s.id!==id);closeModal();dirty();renderConfig()}
async function guardarConfig(){const d=D();if(!d)return;if(!d.cfg.nombre)return toast('Falta el nombre de la barbería');if((d.cfg.adminPin||'').length<4)return toast('El PIN admin debe tener 4+ dígitos');
 if(!slotsDia(d.cfg).length)return toast('⚠️ Revisa el horario: no hay turnos de 1 hora');
 try{await API.saveConfig(d.cfg,d.barberos,d.servicios,d.usuarios);S.draft=null;S.dirty=false;await reload();renderConfig();toast('✅ Configuración guardada')}catch(e){toast('❌ '+e.message)}}
async function exportar(){let data;if(API.remote){try{data=await API.req('GET','/exportar')}catch(e){return toast('❌ '+e.message)}}
 else{data={v:4,usuarios:lsGet('usuarios',[]),fecha:new Date().toISOString(),cfg:lsGet('cfg',{}),barberos:lsGet('barberos',[]),servicios:lsGet('servicios',[]),citas:lsGet('citas',[]),links:lsGet('links',[]),fotos:{}};
  const keys=new Set(JSON.stringify(data).match(/f_[a-z0-9]+/g)||[]);for(const k of keys){const v=await IDB.get(k);if(v)data.fotos[k]=v}}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download=`barberia-respaldo-${hoy()}.json`;a.click()}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.cfg||!Array.isArray(d.citas))throw new Error('Archivo no válido');if(!confirm(`¿Reemplazar todo con el respaldo (${d.citas.length} citas)?`))return;
 if(API.remote){toast('⏳ Subiendo respaldo a la nube…');const x=await API.req('POST','/importar',d);S.draft=null;S.dirty=false;API._d=null;await reload();renderConfig();return toast(`✅ ${x.citas} citas y ${x.fotos} fotos en la nube`)}
 if(d.fotos)for(const[k,v]of Object.entries(d.fotos))await IDB.put(k,v);lsSet('cfg',d.cfg);lsSet('barberos',d.barberos||[]);lsSet('servicios',d.servicios||[]);lsSet('citas',d.citas);if(Array.isArray(d.links))lsSet('links',d.links);if(Array.isArray(d.usuarios))lsSet('usuarios',d.usuarios);S.draft=null;S.dirty=false;await reload();renderConfig();toast('✅ Respaldo importado')}catch(e){toast('❌ '+e.message)}};r.readAsText(f)}
async function probarNube(){toast('⏳ Probando…');try{const r=await API.req('GET','/diagnostico');
 const f=(n,x)=>`${x.ok?'✅':'❌'} ${n}: ${x.ok?'funciona':x.error}`;alert([f('Base de datos (D1)',r.db),f('Fotos (R2)',r.fotos),'',r.db.ok?`Citas guardadas: ${r.db.citas} · Links: ${r.db.links}`:'',(r.db.ok&&r.fotos.ok)?'Todo conectado correctamente.':'En Cloudflare: Workers & Pages → tu Worker → Settings → Bindings.'].join('\n').trim())}catch(e){toast('❌ '+e.message)}}
async function cargarDemo(){lsSet('citas',[...lsGet('citas',[]).filter(c=>!c.demo),...demoCitas()]);await reload();toast('🧪 Ejemplos cargados en la Agenda')}
async function borrarTodo(){if(!confirm('¿Borrar TODAS las citas?')||prompt('Escribe BORRAR para confirmar')!=='BORRAR')return;lsSet('citas',[]);await reload();toast('🗑️ Citas borradas')}

/* ---------- inicio ---------- */
(async function(){
 if(!API.remote)seed();
 let pc={};if(API.remote){try{pc=(await API.req('GET','/publico')).cfg||{}}catch(e){}}else pc=lsGet('cfg',{});
 const cfg=mergeCfg(pc);applyTheme(cfg);$('#lgNombre').textContent=cfg.nombre;logoHTML($('#lgLogo'),cfg);
 $('#lgHint').innerHTML=API.remote?'':'Modo local · PIN admin: <b>1234</b><br>Barberos de ejemplo: 1111, 2222, 3333…<br>Cámbialos en ⚙️ Config.';
 if(S.ses){$('#login').style.display='none';await boot()}else setTimeout(()=>$('#pin').focus(),200);
})();
</script>
