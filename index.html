<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0812">
<title>Barbería · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="vendor/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU"></script>
<style>
:root{--bg:#0b0812;--card:#15101f;--card2:#1d1530;--line:#33264a;--tx:#f3eefc;--mu:#a397b8;--blue:#8a3ffc;--pur:#ff3fd2;--grn:#3fb950;--red:#f85149;--yel:#d29922;--org:#f0883e;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 'DM Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.syne{font-family:'Syne',sans-serif}
/* header */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 14px;height:78px}
.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--pur));display:grid;place-items:center;font-size:28px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand{flex:1;min-width:0}
.brand h1{font:800 20px 'Syne';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--mu);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap}
.ibtn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:19px;position:relative;flex:none}
.ibtn .dot{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.ibtn.out{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.08)}
.ibtn.bare{border:0;background:none}
#vivo{position:absolute;bottom:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--mu);border:2px solid var(--card);opacity:.6}
#vivo.on{background:#3fb950;opacity:1;box-shadow:0 0 8px #3fb950}
#notif{position:fixed;z-index:80;top:64px;right:12px;width:min(390px,calc(100vw - 24px));max-height:72vh;display:none;flex-direction:column;background:var(--card,#161025);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden}
#notif.on{display:flex}#notif .nh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
#notif .nh b{font-size:16px}#notif .nh button{color:var(--mu);font-size:13px;background:none;border:0}
#notif .nl{overflow:auto;padding:4px 0}#notif .ni{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
#notif .ni:last-child{border-bottom:0}#notif .ni .e{font-size:22px;line-height:1}#notif .ni .x{flex:1;min-width:0}
#notif .ni .x b{display:block;font-size:14px}#notif .ni .x small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
#notif .ni .t{color:var(--mu);font-size:11px;white-space:nowrap}#notif .ni.nueva .t::after{content:'';display:block;width:8px;height:8px;border-radius:50%;background:var(--pur);margin:6px 0 0 auto}
#notif .ni .ac{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}#notif .ni .ac .btn{padding:7px 12px;font-size:13px}
#notif .vac{padding:28px 16px;text-align:center;color:var(--mu)}
.tabs{position:sticky;top:78px;z-index:29;display:flex;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:14px 6px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font-weight:500;white-space:nowrap;font-size:16px}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
main{padding:14px;max-width:760px;margin:0 auto;padding-bottom:120px}
.sec{display:none}.sec.on{display:block}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 8px;text-align:center;cursor:pointer}
.stat b{display:block;font:800 40px/1.05 'Syne'}
.stat span{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
/* search + chips */
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 14px;flex:1}
.search input{flex:1;background:none;border:0;outline:none;padding:13px 0;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:13px;white-space:nowrap;text-transform:uppercase}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid var(--blue);color:var(--blue);background:rgba(138,63,252,.08)}
.fchip.lim{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.08)}
.days{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;padding:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:center;position:relative}
.day b{display:block;font:800 20px 'Syne'}
.day small{font-size:10px;color:var(--mu);text-transform:uppercase;font-weight:700}
.day.on{background:var(--blue);border-color:var(--blue)}.day.on small{color:#fff}
.day i{position:absolute;top:-6px;right:-4px;background:var(--pur);color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tool{width:54px;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:24px;display:grid;place-items:center}
.tool.p{background:var(--blue);border-color:var(--blue)}
.tool.pu{background:rgba(255,63,210,.15);border-color:var(--pur)}
/* grupos y tarjetas */
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:12px;padding:15px 14px;border-bottom:1px solid var(--line)}
.grp-h .bar{width:5px;height:30px;border-radius:4px}
.grp-h h3{font:800 18px 'Syne';flex:1;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{border:1px solid var(--line);border-radius:10px;padding:3px 11px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--card2);display:grid;place-items:center;flex:none;font-size:17px}
.av.lg{width:48px;height:48px;font-size:22px}
.cita{padding:16px 14px;border-bottom:1px solid var(--line)}
.cita:last-child{border-bottom:0}
.cn{font-weight:700;font-size:19px;flex:1;min-width:0;line-height:1.2}
.rb{width:46px;height:46px;border-radius:50%;border:1px solid #2ea04366;background:rgba(46,160,67,.1);display:grid;place-items:center;font-size:19px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 4px;font-size:15px}
.meta .lk{color:var(--blue);cursor:pointer}
.sub2{color:var(--mu);font-size:14px;text-transform:uppercase;margin-top:2px}
.nota{color:var(--pur);font-size:14px;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;color:var(--mu);background:var(--bg)}
.tag.lk{color:var(--blue);cursor:pointer}
.box{border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));background:color-mix(in srgb,var(--blue) 5%,var(--card));border-radius:16px;padding:12px;margin-top:12px}
.box h5{font:700 12px 'DM Sans';letter-spacing:.1em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.box h5 span{flex:1}
.phs3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phs3 .ph{aspect-ratio:3/4;font-size:12px}
.phs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph{position:relative;aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--mu);font-size:13px;font-weight:700;cursor:pointer;overflow:hidden;background:var(--bg);text-align:center}
.ph input{display:none}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .tg{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);padding:2px 8px;border-radius:99px;font-size:11px;color:#fff;z-index:1}
.ph .re{position:absolute;right:6px;bottom:6px;z-index:1;background:rgba(0,0,0,.7);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px}
.acts{display:flex;gap:10px;margin-top:14px;align-items:stretch}
.big{flex:1;border-radius:14px;padding:13px 10px;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;border:1.5px solid;text-align:center;line-height:1.25}
.sq{width:54px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:20px;display:grid;place-items:center;flex:none}
.sq.r{border-color:#f8514966;background:rgba(248,81,73,.08)}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
.empty b{display:block;font-size:42px;margin-bottom:8px}
.banner{border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px;border:1px solid var(--yel);color:var(--yel);background:rgba(210,153,34,.08)}
.banner.pu{border-color:var(--pur);color:var(--tx);background:rgba(255,63,210,.1)}
.banner .row{margin-top:10px}
/* forms */
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;min-width:0}
.in:focus{border-color:var(--blue)}
textarea.in{resize:vertical;font-size:14px}
.lb{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:14px 0 6px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.g{background:#238636;border-color:#2ea043;color:#fff}
.btn.pu{background:rgba(255,63,210,.15);border-color:var(--pur);color:var(--pur)}
.btn.r{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.08)}
.btn.w{width:100%}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--mu);margin-top:10px}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{padding:11px 0;width:calc(25% - 6px);border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.dchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t small{color:var(--mu)}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;border:0}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--blue)}.sw.on::after{left:24px}
.pre{display:flex}.pre span{padding:12px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--card2);color:var(--mu)}.pre .in{border-radius:0 12px 12px 0}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.swc{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swc.on{border-color:#fff}
.upl{display:flex;align-items:center;gap:12px;cursor:pointer}
.upl .prev{width:64px;height:64px;border-radius:14px;background:var(--card2);display:grid;place-items:center;overflow:hidden;font-size:28px;flex:none}
.upl .prev img{width:100%;height:100%;object-fit:cover}
.upl input{display:none}
.vars{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.vars button{font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--blue)}
/* config acordeón */
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;padding:16px;background:none;border:0;text-align:left}
.acc>button b{flex:1;font:700 13px 'DM Sans';letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.acc>button small{color:var(--mu);font-size:12px;display:block;letter-spacing:0;text-transform:none;font-weight:500;margin-top:2px}
.acc>button i{font-style:normal;color:var(--mu);transition:.2s}
.acc.open>button i{transform:rotate(90deg)}
.acc{scroll-margin-top:150px}
.acc>div{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc.open>div{grid-template-rows:1fr}
.acc .accb{overflow:hidden;padding:0 16px;min-height:0}
.acc.open .accb{padding-bottom:16px}
.acc>button i{font-size:20px}
#cfgSave.pend{box-shadow:0 0 0 3px rgba(63,185,80,.35);animation:pp 1.6s ease-in-out infinite}
@keyframes pp{50%{box-shadow:0 0 0 6px rgba(63,185,80,.12)}}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:25;display:none}
.savebar.on{display:block}
.savebar .btn{max-width:732px;margin:0 auto;display:flex;width:100%;font-size:17px;padding:15px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,5,14,.78);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:680px;max-height:94vh;overflow:auto;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font:800 21px 'Syne';margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:none;border:0;font-size:22px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:99px;font-weight:700;z-index:80;transition:.3s;max-width:92%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.login .logo{width:80px;height:80px;font-size:42px;border-radius:24px;margin-bottom:14px}
.login h2{font:800 26px 'Syne'}
.pin{font:800 28px 'Syne';letter-spacing:.4em;text-align:center;max-width:260px;margin:22px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.n{text-align:right}
.stamps{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.stamps i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:10px}
.stamps i.on{background:var(--pur);border-color:var(--pur)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.gal div{position:relative}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--card2);display:block}
.gal span{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);font-size:10px;padding:1px 7px;border-radius:99px}
.qr{background:#fff;padding:14px;border-radius:16px;width:max-content;margin:14px auto}
.url{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;word-break:break-all;font-size:14px;color:var(--blue);margin:10px 0}
.stp{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
/* dashboard */
.bars .br{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;padding:7px 0;cursor:pointer}
.bars .br span{font-size:14px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .br i{display:block;height:12px;border-radius:99px;background:var(--bg);overflow:hidden}
.bars .br i b{display:block;height:100%;border-radius:99px;min-width:4px}
.bars .br em{font-style:normal;color:var(--mu);font-weight:700;min-width:36px;text-align:right}
.bars .dt{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:2px 0 8px;font-size:13px;color:var(--mu)}
.bars .dt .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.bars .dt .r b{color:var(--tx);font-weight:600}
.dsec{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.dsec h6{font:700 12px 'DM Sans';letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.top10 .tr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.top10 .tr:last-child{border-bottom:0}
.top10 .tr>b:first-child{color:var(--mu);width:18px}
.top10 .tr .t{flex:1;min-width:0}.top10 .tr .t div{font-weight:700;text-transform:uppercase;font-size:15px}.top10 .tr .t small{color:var(--mu)}
.top10 .tr em{font:800 22px 'Syne';color:var(--blue);font-style:normal}.top10 .tr em small{font:500 12px 'DM Sans';color:var(--mu)}
.kp small{display:block;font-size:11px;color:var(--mu);margin-top:4px}
.mn h4{font:700 13px 'DM Sans';letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}
.cols{background:color-mix(in srgb,var(--blue) 8%,var(--card));border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));border-radius:14px;padding:12px;font-size:13px;color:var(--mu);line-height:1.8}
.lnk{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.lnk .row b{flex:1;font-size:17px}
.st{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid}
/* próximas / chips / usuarios */
/* filtros de la agenda (js/panel/filtros.js) */
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.chip.f{text-transform:none;font-size:14px;white-space:normal;text-align:left}
.fbar{position:sticky;bottom:-22px;display:flex;flex-direction:column;gap:10px;margin-top:18px;padding:12px 0 6px;background:var(--card);border-top:1px solid var(--line)}
.limpia{font:600 14px 'DM Sans',system-ui,sans-serif;color:var(--mu);text-decoration:underline;cursor:pointer;white-space:nowrap}
.chip .cc{font-style:normal;margin-left:6px;background:rgba(255,255,255,.12);border-radius:99px;padding:1px 7px;font-size:11px}
.rb.al{background:var(--card2);border-color:var(--line);color:var(--tx)}
.rb.al.ok{background:#238636;border-color:#3fb950;box-shadow:0 0 0 3px #3fb95033}
.prox{background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0 10px 14px}
.pxh{font:700 11px 'DM Sans';letter-spacing:.1em;color:var(--blue);margin-bottom:6px;text-transform:uppercase}.pxh b{background:var(--pur);color:#fff;border-radius:99px;padding:1px 7px;margin-left:4px}
.pxl{display:flex;gap:10px;overflow-x:auto;padding:2px 14px 2px 0;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}.pxl::-webkit-scrollbar{display:none}
.pc{flex:none;scroll-snap-align:start;min-width:220px;max-width:260px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 56px 10px 12px;cursor:pointer}
.pc.late{border-color:var(--yel)}.pc .pt{display:flex;justify-content:space-between;gap:8px}.pc .pt span{color:var(--blue);font-weight:700;white-space:nowrap}
.pc .ps{font-size:12px;color:var(--mu);margin-top:4px}.pc .ps b{color:var(--tx)}
.pc .rb{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;font-size:17px}
.next{background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 16%,var(--card)),color-mix(in srgb,var(--pur) 14%,var(--card)));border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line));border-radius:var(--r);padding:14px;margin-bottom:12px}
.next .lbl{font:700 12px 'DM Sans';letter-spacing:.12em;color:var(--blue);flex:1}
.next .big2{font:800 26px 'Syne'}
.next.late{border-color:var(--red);background:rgba(248,81,73,.08)}.next.late .big2,.next.late .lbl{color:var(--red)}
.tag.cd{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.tag.cd.late{color:var(--red);border-color:var(--red)}
.gnx{font:500 12px 'DM Sans';color:var(--mu);display:block;text-transform:none;letter-spacing:0}
.perm{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.perm span{flex:1}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.chr{display:inline-flex;align-items:center;gap:6px;font:800 15px 'Syne';letter-spacing:.04em;padding:6px 12px;border-radius:12px;border:1.5px solid var(--blue);color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);font-variant-numeric:tabular-nums;cursor:pointer}
.chr.run{border-color:var(--grn);color:var(--grn);background:rgba(63,185,80,.1)}
.chr.warn{border-color:var(--yel);color:var(--yel);background:rgba(210,153,34,.1)}
.chr.late{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.1)}
.chr.done{border-color:var(--line);color:var(--mu);background:var(--bg)}
.chr.run::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.et{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;width:100%;padding:18px 16px;border-radius:16px;border:1.5px solid;margin-bottom:10px;text-align:left;font-weight:800;font-size:16px;text-transform:uppercase}
.et span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et em{font-style:normal;font-weight:700;color:var(--org);text-transform:none}
.et b{font-weight:600;min-width:28px;text-align:right}
.dsec2{background:var(--card2);border:1px solid var(--line);border-radius:18px;margin-top:16px;overflow:hidden}
.dsec2 summary{list-style:none;display:flex;align-items:center;gap:8px;padding:16px;font:700 13px 'DM Sans';letter-spacing:.1em;text-transform:uppercase;color:var(--mu);border-bottom:1px solid var(--line);cursor:pointer}
.dsec2 summary::-webkit-details-marker{display:none}
.dsec2 summary span{margin-left:auto;transition:.2s}.dsec2:not([open]) summary span{transform:rotate(180deg)}
.dsb{padding:14px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dbox{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--bg);position:relative;overflow:hidden;cursor:pointer;text-align:center;padding:6px}
.dbox.has{border-style:solid;border-color:var(--blue)}
.dbox .di{font-size:38px}.dbox b{font-size:14px}
.dbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dbox .dt{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.dbox input,.dadd input{display:none}
.dadd{white-space:nowrap;display:flex;align-items:center;justify-content:center;margin-top:8px;width:100%;padding:10px 4px;border-radius:12px;border:1px solid color-mix(in srgb,var(--blue) 50%,var(--line));background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);font-weight:700;font-size:14px;cursor:pointer}
.lkrow{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin-top:8px}
.lkrow a{flex:1;min-width:0;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;font-weight:600;font-size:14px}
#viewer{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:16px}
#viewer.on{display:flex}#viewer img{max-width:100%;max-height:100%;border-radius:12px}#viewer .x{position:absolute;top:16px;right:16px;color:#fff;font-size:26px}
.stp>div{flex:1;min-width:0}.stp>div>b{display:block;font-size:15px}
.stp>b{width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none;font-size:14px}
</style>
</head>
